blueprint:
  name: Dynamic EV Charging Automation v3.1 - Tesla Fleet
  description: |
    ## Dynamic EV Charging Automation v3.1 - Tesla Fleet

    Adjusts EV charging current using the whole-house power reading and your
    Maximum Grid Draw setting. The household total includes EV charging.

    ### Development version
    v3.1 is still in development. Known reliability issues and the release checklist
    are documented in the [repository README](https://github.com/Teeseeone/electric-vehicle-ev-dynamic-charging-home-assistant-/blob/main/README.md#v31-review-findings-and-release-requirements).
    Clearer labels and help text do not resolve those issues.

    ### Choose the right entities
    - **[HOUSE]**: whole-house power meter, such as Tibber Pulse. Use watts (W).
    - **[CAR]**: the target vehicle, normally Tesla Fleet. Used for current and start/stop commands.
    - **[CHARGER]**: the local wall charger, such as Tesla Wall Connector. Used for local measurements and status.
    - **[CAR/PERSON]**: optional location tracker. Leave empty to skip the location restriction.

    ### Setup order
    1. Choose the house power sensor and the car's charging status, start/stop control, and current control.
    2. Set Maximum Grid Draw for the whole house and choose the electrical supply fallback.
    3. Set minimum, starting, and maximum charging current for your vehicle and installation.
    4. Optionally add local charger measurements and status. Use power in W and current in A.
    5. For a shared charger, add both connection sensors. These checks reduce shared-charger risk but do not identify which vehicle is connected.
    6. Adjust ramp timing, restart lockout, and failsafe settings. Enable debug logging while tuning.

    ### How the controls differ
    - **Minimum current**: if the calculated target is lower, request charging stop.
    - **Starting current**: the request sent before starting; capped by the calculated target and configured maximum.
    - **Maximum current**: the upper limit used in target calculations.
    - **Ramp-up**: increase current gradually, checking house and charger readings before every increase.
    - **Ramp-down**: reduce current in configured steps toward the target calculated for that reduction sequence.
    - **Deadband**: the minimum increase needed to begin a new ramp; it does not block reductions.
    - **Stability delay**: wait, then recalculate available power before starting or increasing. This is a second check, not continuous monitoring throughout the delay.
    - **Restart lockout**: delay restart after the start/stop switch is off or charging status is stopped/no_power.

    ### Power-sensor failsafe
    When the house-power reading is invalid or considered stale, new starts and
    increases are blocked. Once the current timestamp-based timeout test is met,
    an active session is capped at the failsafe current. The cap never raises a
    lower current. Defaults: 10 A and 120 seconds. See the README for known
    freshness/timer limitations.

    ### Evaluation and logging
    Idle checks run once per minute. One run controls an active ramp; scheduled
    checks do not interrupt it. Debug messages appear in the Home Assistant Logbook.

    Start/stop supports Tesla Fleet switches and select controls with the exact
    options "Start charging" and "Stop charging". Tesla Fleet commands wake the
    vehicle automatically when required.

  domain: automation

  input:
    device_tracker:
      name: "[CAR/PERSON] Location Tracker (Optional)"
      description: >
        Leave empty to skip location checking. If selected, the tracker must report home when a run
        begins; other states block the run. Choose the car or a relevant person's device tracker.
      default: ""
      selector:
        entity:
          domain: device_tracker

    sensor_charging:
      name: "[CAR] Charging Status (Fallback)"
      description: >
        Choose the target vehicle's charging-status sensor, normally Tesla Fleet. A configured local
        charger status is preferred; this car sensor is used when the local status is absent or
        unknown/unavailable. Example states: charging, stopped, complete, disconnected, no_power.
      default: sensor.ev_charger_estado
      selector:
        entity:
          domain: sensor

    charger_toggle:
      name: "[CAR] Charging Start/Stop Control"
      description: >
        Choose the target vehicle's charging control, normally the Tesla Fleet charge switch. A
        switch starts charging when turned on and stops when turned off. A select control must
        provide the exact options "Start charging" and "Stop charging".
      default: select.ev_charger_toggle_charging
      selector:
        entity:
          domain:
            - select
            - switch

    sensor_house_power:
      name: "[HOUSE] Total Household Power (W)"
      description: >
        Choose a fast-updating sensor for the whole-house total, including EV charging. The value
        must be in watts (W), not kilowatts (kW). Example: Tibber Pulse. This reading is compared
        with Maximum Grid Draw.
      default: sensor.shellyemg3_8cbfea96acd8_em1_power
      selector:
        entity:
          domain: sensor
          device_class: power

    charger_power_sensor:
      name: "[CHARGER] Measured Charging Power (W, Optional)"
      description: >
        Choose the local charger's measured power in watts (W), for example Tesla Wall Connector
        total power / Billader. Leave empty to estimate EV load from the current request. Adding
        measured current too lets the automation calculate watts per amp from both measurements.
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: power

    charger_current_sensor:
      name: "[CHARGER] Measured Charging Current (A, Optional)"
      description: >
        Choose the local charger's measured current in amps (A), for example Tesla Wall Connector
        Vehicle current. This measures charging; it does not control it. Used with measured power to
        calculate watts per amp. Leave empty to use the electrical supply fallback for that
        calculation.
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: current

    charger_status_sensor:
      name: "[CHARGER] Local Charging Status (Optional)"
      description: >
        Choose the local wall charger's status sensor, for example
        sensor.tesla_wall_connector_status. Its reported status takes priority over the car's
        status. Leave empty to use the car sensor; an unknown/unavailable local status also falls
        back to the car.
      default: ""
      selector:
        entity:
          domain: sensor

    charger_vehicle_connected_sensor:
      name: "[CHARGER] Vehicle Connected Check (Optional)"
      description: >
        Choose the local charger's vehicle-connected binary sensor. It must report on when
        connection checks run. Leave empty to skip this check. On a shared charger, also select the
        target car's cable sensor; the pair does not identify which car is connected.
      default: ""
      selector:
        entity:
          domain: binary_sensor

    target_ev_charge_cable_sensor:
      name: "[CAR] Target Vehicle Cable Check (Optional)"
      description: >
        Choose the target vehicle's charge-cable binary sensor, normally Tesla Fleet. It must report
        on when connection checks run. Leave empty to skip this check. Recommended alongside the
        local vehicle-connected check for a shared charger.
      default: ""
      selector:
        entity:
          domain: binary_sensor

    max_grid_power:
      name: "Maximum Grid Draw — Whole House (W)"
      description: >
        Household power limit in watts (W), including EV charging. Example: 9000 means 9 kW for the
        whole house. Sensor and command delays can allow temporary overshoot.
      default: 9000
      selector:
        number:
          min: 0
          max: 30000
          step: 100

    charging_current:
      name: "[CAR] Charging Current Control (A)"
      description: >
        Choose the target vehicle's number entity for requesting charging current, normally Tesla
        Fleet. This control receives current commands in amps (A); it is different from the optional
        measured-current sensor.
      default: number.ev_charger_set_charge_current
      selector:
        entity:
          domain: number

    supply_type:
      name: "Electrical Supply (Calculation Fallback)"
      description: >
        Choose the supply used when measured charger power/current cannot provide watts per amp.
        Single-phase 230 V uses 230 W/A; three-phase 230 V uses about 398 W/A; three-phase 400 V
        uses about 693 W/A. When both measured values are positive, their ratio takes priority.
      default: single_phase_230
      selector:
        select:
          options:
            - label: "Single-phase 230 V"
              value: single_phase_230
            - label: "Three-phase 230 V"
              value: three_phase_230
            - label: "Three-phase 400 V"
              value: three_phase_400

    max_amps:
      name: "Maximum Charging Current (A)"
      description: >
        Upper current limit used by the automation. Set it for your vehicle, charger, and
        installation, within the selected current-control entity's supported range. Keep Minimum
        Charging Current at or below this value.
      default: 20
      selector:
        number:
          min: 6
          max: 32
          step: 1

    min_amps:
      name: "Minimum Charging Current — Stop Below This (A)"
      description: >
        Request charging stop when the calculated target is below this value. Choose a current your
        EV/charger supports. Keep it at or below the maximum and at or below the starting current.
      default: 1
      selector:
        number:
          min: 1
          max: 32
          step: 1

    starting_amps:
      name: "Starting Charging Current — Before Start (A)"
      description: >
        Current requested immediately before start/restart. Automatically lowered when needed to
        stay within the calculated target and configured maximum. Set it at or above Minimum
        Charging Current; the automation does not raise it to that minimum.
      default: 6
      selector:
        number:
          min: 1
          max: 32
          step: 1

    increase_step_amps:
      name: "Ramp-Up: Increase per Step (A)"
      description: >
        Amps added with each increase command. Example: 1 A moves a 6 A request to 7 A. The last
        step may be smaller to reach the latest target without exceeding it.
      default: 1
      selector:
        number:
          min: 1
          max: 10
          step: 1

    increase_delay_seconds:
      name: "Ramp-Up: Wait Before Each Step (seconds)"
      description: >
        Wait this long before each increase, then read house power and charger measurements again.
        Example: 1 A steps with 10 seconds here increase gradually, subject to the latest target and
        command execution time.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1

    decrease_step_amps:
      name: "Ramp-Down: Decrease per Step (A)"
      description: >
        Amps removed with each reduction command. Example: 2 A moves a 20 A request to 18 A. The
        last step may be smaller to reach the target calculated for this reduction sequence.
      default: 2
      selector:
        number:
          min: 1
          max: 10
          step: 1

    decrease_delay_seconds:
      name: "Ramp-Down: Wait After Each Step (seconds)"
      description: >
        Wait after each reduction command, including the final one. Longer delays reduce current
        more slowly. During this reduction sequence, the target stays fixed; household power is not
        rechecked within that sequence.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1

    ramp_up_deadband_amps:
      name: "Ramp-Up: Minimum Increase to Begin (A)"
      description: >
        Minimum difference between target and current needed to begin a new upward ramp. Example:
        with 1 A here, a target of 19 A can start a ramp from 18 A. Once a ramp begins, it can
        finish with a smaller step. This setting never blocks ramp-down.
      default: 1
      selector:
        number:
          min: 0
          max: 5
          step: 1

    ramp_up_stability_seconds:
      name: "Start/Ramp-Up: Stability Delay (seconds)"
      description: >
        Wait before starting/restarting or beginning an upward ramp, then check available power
        again. Example: 30 seconds performs a second check after that wait. The code does not
        require every reading during the wait to remain stable.
      default: 30
      selector:
        number:
          min: 0
          max: 300
          step: 5

    restart_delay_seconds:
      name: "Restart: Lockout After Stop (seconds)"
      description: >
        Delay restart when the charge switch is off or charging status is stopped/no_power. Measured
        from the relevant entity's last state change. Default: 300 seconds (5 minutes). Other
        eligible idle states may skip this lockout.
      default: 300
      selector:
        number:
          min: 0
          max: 1800
          step: 30

    failsafe_current_amps:
      name: "Power Failsafe: Current Cap (A)"
      description: >
        Current cap for an already-active session when the house-power timeout is reached. Never
        raises a lower current or starts a stopped vehicle. Also capped at Maximum Charging Current.
        Default: 10 A. Choose a value your vehicle supports.
      default: 10
      selector:
        number:
          min: 1
          max: 32
          step: 1

    failsafe_timeout_seconds:
      name: "Power Failsafe: Timeout / Freshness Limit (seconds)"
      description: >
        House-reading age limit and timeout before the failsafe cap applies. Invalid readings block
        starts and increases immediately. Default: 120 seconds (2 minutes). The current version
        measures age from the last value/attribute change; see the README for known limitations.
      default: 120
      selector:
        number:
          min: 30
          max: 600
          step: 30

    debug_logging:
      name: "Debug Logging — Home Assistant Logbook"
      description: >
        Enable while testing or tuning. Logbook messages show house load, grid headroom, EV power
        budget, measured/estimated inputs, target current, and hold/start/stop/ramp/failsafe
        decisions. Disable when you no longer need these detailed messages.
      default: false
      selector:
        boolean:


triggers:
  - trigger: time_pattern
    minutes: "/1"

variables:
  device_tracker_input: !input device_tracker

condition:
  - condition: template
    value_template: >-
      {{ device_tracker_input in [none, '', 'none']
         or is_state(device_tracker_input, 'home') }}

action:
  - variables:
      supply_type: !input supply_type
      max_amps: !input max_amps
      min_amps: !input min_amps
      starting_amps: !input starting_amps
      increase_step_amps: !input increase_step_amps
      increase_delay_seconds: !input increase_delay_seconds
      decrease_step_amps: !input decrease_step_amps
      decrease_delay_seconds: !input decrease_delay_seconds
      ramp_up_deadband_amps: !input ramp_up_deadband_amps
      ramp_up_stability_seconds: !input ramp_up_stability_seconds
      restart_delay_seconds: !input restart_delay_seconds
      failsafe_current_amps: !input failsafe_current_amps
      failsafe_timeout_seconds: !input failsafe_timeout_seconds
      debug_logging: !input debug_logging

      sensor_house_power_entity: !input sensor_house_power
      charger_power_sensor_input: !input charger_power_sensor
      charger_current_sensor_input: !input charger_current_sensor
      charger_status_sensor_input: !input charger_status_sensor
      charger_vehicle_connected_sensor_input: !input charger_vehicle_connected_sensor
      target_ev_charge_cable_sensor_input: !input target_ev_charge_cable_sensor
      charging_current_entity: !input charging_current
      sensor_charging_entity: !input sensor_charging
      charger_toggle_entity: !input charger_toggle

      charger_vehicle_connected_ok: >-
        {{ charger_vehicle_connected_sensor_input in [none, '', 'none']
           or is_state(charger_vehicle_connected_sensor_input, 'on') }}
      target_ev_charge_cable_ok: >-
        {{ target_ev_charge_cable_sensor_input in [none, '', 'none']
           or is_state(target_ev_charge_cable_sensor_input, 'on') }}

      active_grid_limit: !input max_grid_power

      theoretical_watts_per_amp: >-
        {% if supply_type == 'single_phase_230' %}
          {{ 230 }}
        {% elif supply_type == 'three_phase_230' %}
          {{ 230 * 1.7320508075688772 }}
        {% else %}
          {{ 400 * 1.7320508075688772 }}
        {% endif %}

      fleet_charging_state: "{{ states(sensor_charging_entity) | lower }}"
      local_charger_state: >-
        {% if charger_status_sensor_input not in [none, '', 'none'] %}
          {{ states(charger_status_sensor_input) | lower }}
        {% else %}
          unavailable
        {% endif %}
      charging_state: >-
        {% if charger_status_sensor_input not in [none, '', 'none']
              and local_charger_state not in ['unknown', 'unavailable', 'none', ''] %}
          {{ local_charger_state }}
        {% else %}
          {{ fleet_charging_state }}
        {% endif %}
      status_entity_for_timing: >-
        {% if charger_status_sensor_input not in [none, '', 'none']
              and local_charger_state not in ['unknown', 'unavailable', 'none', ''] %}
          {{ charger_status_sensor_input }}
        {% else %}
          {{ sensor_charging_entity }}
        {% endif %}
      charging_current_value: "{{ states(charging_current_entity) | float(0) }}"
      effective_failsafe_current: >-
        {{ [failsafe_current_amps | float(10), max_amps | float(32)] | min }}
      house_power_state: "{{ states(sensor_house_power_entity) }}"
      house_power_age_seconds: >-
        {% set power_state = states[sensor_house_power_entity] %}
        {{ [0, as_timestamp(now()) - as_timestamp(power_state.last_updated)] | max }}
      house_power_numeric: "{{ is_number(house_power_state) }}"
      house_power_usable: >-
        {{ house_power_numeric
           and (house_power_age_seconds | float(999999))
               <= (failsafe_timeout_seconds | float(120)) }}
      house_power_failsafe_active: >-
        {{ not house_power_usable
           and (house_power_age_seconds | float(999999))
               >= (failsafe_timeout_seconds | float(120)) }}
      total_consumption: >-
        {% if house_power_numeric %}
          {{ house_power_state | float(0) }}
        {% else %}
          0
        {% endif %}
      grid_headroom: >-
        {{ (active_grid_limit | float(0)) - (total_consumption | float(0)) }}

      measured_charger_power: >-
        {% if charger_power_sensor_input not in [none, '', 'none'] %}
          {{ states(charger_power_sensor_input) | float(0) }}
        {% else %}
          0
        {% endif %}

      measured_charger_current: >-
        {% if charger_current_sensor_input not in [none, '', 'none'] %}
          {{ states(charger_current_sensor_input) | float(0) }}
        {% else %}
          0
        {% endif %}

      watts_per_amp_source: >-
        {% if (measured_charger_power | float(0)) > 0
              and (measured_charger_current | float(0)) > 0 %}
          measured
        {% else %}
          theoretical
        {% endif %}

      watts_per_amp: >-
        {% if watts_per_amp_source == 'measured' %}
          {{ (measured_charger_power | float(0)) / (measured_charger_current | float(0)) }}
        {% else %}
          {{ theoretical_watts_per_amp | float(230) }}
        {% endif %}

      charger_power_source: >-
        {% if charger_power_sensor_input not in [none, '', 'none']
              and (measured_charger_power | float(0)) > 0 %}
          measured
        {% else %}
          estimated
        {% endif %}

      charger_consumption: >-
        {% if charging_state in ['charging', 'charging_reduced', 'starting'] %}
          {% if charger_power_source == 'measured' %}
            {{ measured_charger_power | float(0) }}
          {% else %}
            {{ (charging_current_value | float(0)) * (watts_per_amp | float(230)) }}
          {% endif %}
        {% else %}
          0
        {% endif %}

      actual_free_power: >-
        {% set non_ev_load = [0, (total_consumption | float(0)) - (charger_consumption | float(0))] | max %}
        {% set candidate = (active_grid_limit | float(0)) - non_ev_load %}
        {{ [0, candidate] | max }}

      new_target_value: >-
        {% set raw_amps = (actual_free_power | float(0)) / (watts_per_amp | float(230)) %}
        {% if raw_amps > (max_amps | float) %}
          {{ max_amps | float }}
        {% elif raw_amps < (min_amps | float) %}
          0
        {% else %}
          {{ raw_amps | int }}
        {% endif %}

      stopped_seconds: >-
        {% if charger_toggle_entity.startswith('switch.') and is_state(charger_toggle_entity, 'off') %}
          {{ as_timestamp(now()) - as_timestamp(states[charger_toggle_entity].last_changed) }}
        {% elif charging_state in ['stopped', 'no_power', 'ready', 'connected', 'waiting_car', 'negotiating', 'plugged_in', 'waiting', 'waiting_for_authorization'] %}
          {{ as_timestamp(now()) - as_timestamp(states[status_entity_for_timing].last_changed) }}
        {% else %}
          0
        {% endif %}

      eligible_states:
        - charging
        - charging_reduced
        - starting
        - stopped
        - no_power
        - ready
        - connected
        - waiting_car
        - negotiating
        - plugged_in
        - waiting
        - waiting_for_authorization

  # 1. Check configured connection gates at the beginning of this run.
  # Ramp-up repeats these checks; restart delays and ramp-down have limitations
  # documented in the README.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ not charger_vehicle_connected_ok }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v3.1 - Tesla Fleet
                      entity_id: !input sensor_charging
                      message: >-
                        HOLD: local charger does not report a vehicle connected.
                        No Tesla/EV charging commands were sent.
          - stop: No vehicle is connected to the configured charger

      - conditions:
          - condition: template
            value_template: "{{ not target_ev_charge_cable_ok }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v3.1 - Tesla Fleet
                      entity_id: !input sensor_charging
                      message: >-
                        HOLD: target EV charge-cable sensor is not ON.
                        No charging commands were sent to the target EV.
          - stop: Target EV charge cable is not connected

  # 2. Continue only when the selected local/car status is eligible for control.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ charging_state not in eligible_states }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v3.1 - Tesla Fleet
                      entity_id: !input sensor_charging
                      message: >-
                        HOLD: charging state '{{ charging_state }}' is not eligible for dynamic control.
          - stop: Charging state is not eligible for dynamic control

  # 3. Check house-power validity and the current timestamp-based freshness test.
  # During the timeout, hold the current setting and block all ramp-up/start actions.
  # After the timeout, cap an already-active charging session to the configured failsafe current.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ not house_power_usable }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ house_power_failsafe_active }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: >-
                              {{ charging_state in ['charging', 'charging_reduced', 'starting']
                                 and (charging_current_value | float(0))
                                     > (effective_failsafe_current | float(10)) }}
                        sequence:
                          - action: number.set_value
                            target:
                              entity_id: !input charging_current
                            data:
                              value: "{{ effective_failsafe_current | float(10) }}"

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ debug_logging }}"
                        sequence:
                          - action: logbook.log
                            data:
                              name: Dynamic EV Charging v3.1 - Tesla Fleet
                              entity_id: !input charging_current
                              message: >-
                                FAILSAFE ACTIVE: whole-house power state='{{ house_power_state }}',
                                age={{ house_power_age_seconds | round(0) }} s.
                                Active charging is capped at
                                {{ effective_failsafe_current | round(0) }} A;
                                ramp-up and charging start are blocked until valid power data returns.
                  - stop: Whole-house power failsafe active

            default:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ debug_logging }}"
                    sequence:
                      - action: logbook.log
                        data:
                          name: Dynamic EV Charging v3.1 - Tesla Fleet
                          entity_id: !input charging_current
                          message: >-
                            FAILSAFE PENDING: whole-house power state='{{ house_power_state }}',
                            age={{ house_power_age_seconds | round(0) }} s.
                            Holding current and blocking ramp-up/start.
                            Failsafe cap {{ effective_failsafe_current | round(0) }} A
                            applies after {{ failsafe_timeout_seconds | round(0) }} s.
              - stop: Whole-house power data is temporarily invalid

  # 4. Request stop when the calculated EV budget cannot support the minimum.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ (new_target_value | float(0)) < (min_amps | float) }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ charger_toggle_entity.startswith('switch.') }}"
                sequence:
                  - action: switch.turn_off
                    target:
                      entity_id: !input charger_toggle
            default:
              - action: select.select_option
                target:
                  entity_id: !input charger_toggle
                data:
                  option: Stop charging

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v3.1 - Tesla Fleet
                      entity_id: !input charging_current
                      message: >-
                        STOP: house={{ total_consumption | round(0) }} W,
                        grid_headroom={{ grid_headroom | round(0) }} W,
                        charger={{ charger_consumption | round(0) }} W ({{ charger_power_source }}),
                        W/A={{ watts_per_amp | round(1) }} ({{ watts_per_amp_source }}),
                        limit={{ active_grid_limit | round(0) }} W,
                        EV_budget={{ actual_free_power | round(0) }} W,
                        target=0 A, state={{ charging_state }}.
          - stop: Not enough power to charge above the minimum current

  # 5. For eligible idle states, check lockout, wait, recheck power, and request start.
  # Lockout applies to an off switch or stopped/no_power status.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ charging_state in ['stopped', 'no_power', 'ready', 'connected', 'waiting_car', 'negotiating', 'plugged_in', 'waiting', 'waiting_for_authorization'] }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ (charger_toggle_entity.startswith('switch.') and is_state(charger_toggle_entity, 'off')
                          or charging_state in ['stopped', 'no_power'])
                         and (stopped_seconds | float(0)) < (restart_delay_seconds | float(0)) }}
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ debug_logging }}"
                        sequence:
                          - action: logbook.log
                            data:
                              name: Dynamic EV Charging v3.1 - Tesla Fleet
                              entity_id: !input sensor_charging
                              message: >-
                                WAIT TO RESTART: stopped for {{ stopped_seconds | int }} s;
                                restart lockout={{ restart_delay_seconds | int }} s.
                  - stop: Restart lockout is still active

          # Wait, then perform a second power check before restarting.
          # This delay does not continuously monitor stability.
          - delay:
              seconds: "{{ ramp_up_stability_seconds | int }}"

          - variables:
              confirmed_house_power_state: "{{ states(sensor_house_power_entity) }}"
              confirmed_house_power_age_seconds: >-
                {% set power_state = states[sensor_house_power_entity] %}
                {{ [0, as_timestamp(now()) - as_timestamp(power_state.last_updated)] | max }}
              confirmed_house_power_numeric: "{{ is_number(confirmed_house_power_state) }}"
              confirmed_house_power_usable: >-
                {{ confirmed_house_power_numeric
                   and (confirmed_house_power_age_seconds | float(999999))
                       <= (failsafe_timeout_seconds | float(120)) }}
              confirmed_total_consumption: >-
                {% if confirmed_house_power_numeric %}
                  {{ confirmed_house_power_state | float(0) }}
                {% else %}
                  0
                {% endif %}
              confirmed_grid_headroom: >-
                {{ (active_grid_limit | float(0)) - (confirmed_total_consumption | float(0)) }}
              confirmed_free_power: >-
                {% set candidate = (active_grid_limit | float(0)) - (confirmed_total_consumption | float(0)) %}
                {% set bounded = [candidate, (active_grid_limit | float(0))] | min %}
                {{ [0, bounded] | max }}
              confirmed_target: >-
                {% set raw_amps = (confirmed_free_power | float(0)) / (watts_per_amp | float(230)) %}
                {% if raw_amps > (max_amps | float) %}
                  {{ max_amps | float }}
                {% elif raw_amps < (min_amps | float) %}
                  0
                {% else %}
                  {{ raw_amps | int }}
                {% endif %}
              safe_start_amps: >-
                {{ [starting_amps | float, confirmed_target | float, max_amps | float] | min }}

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ not confirmed_house_power_usable }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ debug_logging }}"
                        sequence:
                          - action: logbook.log
                            data:
                              name: Dynamic EV Charging v3.1 - Tesla Fleet
                              entity_id: !input charging_current
                              message: >-
                                HOLD RESTART: whole-house power state='{{ confirmed_house_power_state }}',
                                age={{ confirmed_house_power_age_seconds | round(0) }} s.
                                Charging start is blocked until valid fresh house power returns.
                  - stop: Whole-house power invalid after restart stability delay

              - conditions:
                  - condition: template
                    value_template: "{{ (confirmed_target | float(0)) >= (min_amps | float) }}"
                sequence:
                  # Set the configured starting current, clamped to the safe target.
                  - action: number.set_value
                    target:
                      entity_id: !input charging_current
                    data:
                      value: "{{ safe_start_amps | float }}"

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ charger_toggle_entity.startswith('switch.') }}"
                        sequence:
                          - action: switch.turn_on
                            target:
                              entity_id: !input charger_toggle
                    default:
                      - action: select.select_option
                        target:
                          entity_id: !input charger_toggle
                        data:
                          option: Start charging

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ debug_logging }}"
                        sequence:
                          - action: logbook.log
                            data:
                              name: Dynamic EV Charging v3.1 - Tesla Fleet
                              entity_id: !input charging_current
                              message: >-
                                {% if charger_toggle_entity.startswith('switch.') %}
                                  START COMMAND SENT – Tesla Fleet will wake vehicle automatically if required.
                                {% else %}
                                  START COMMAND SENT via select-based charger control.
                                {% endif %}
                                Requested start current={{ safe_start_amps | round(0) }} A
                                (configured={{ starting_amps | round(0) }} A,
                                safe target={{ confirmed_target | round(0) }} A).

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ debug_logging }}"
                        sequence:
                          - action: logbook.log
                            data:
                              name: Dynamic EV Charging v3.1 - Tesla Fleet
                              entity_id: !input charging_current
                              message: >-
                                RESTART: house={{ confirmed_total_consumption | round(0) }} W,
                                grid_headroom={{ confirmed_grid_headroom | round(0) }} W,
                                stable EV budget={{ confirmed_free_power | round(0) }} W,
                                confirmed target={{ confirmed_target | round(0) }} A.
            default:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ debug_logging }}"
                    sequence:
                      - action: logbook.log
                        data:
                          name: Dynamic EV Charging v3.1 - Tesla Fleet
                          entity_id: !input sensor_charging
                          message: >-
                            HOLD STOPPED: power was not still sufficient after
                            {{ ramp_up_stability_seconds | int }} s stability check.
              - stop: Spare power was not stable enough to restart

          # Ramp from the configured start current. Before every increase step,
          # re-read Tibber/house power and local charger measurements.
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ (states(charging_current_entity) | float(0)) < (max_amps | float(0)) }}
              sequence:
                - delay:
                    seconds: "{{ increase_delay_seconds | int }}"

                - variables:
                    step_current: "{{ states(charging_current_entity) | float(0) }}"
                    step_house_power_state: "{{ states(sensor_house_power_entity) }}"
                    step_house_power_age_seconds: >-
                      {% set power_state = states[sensor_house_power_entity] %}
                      {{ [0, as_timestamp(now()) - as_timestamp(power_state.last_updated)] | max }}
                    step_house_power_numeric: "{{ is_number(step_house_power_state) }}"
                    step_house_power_usable: >-
                      {{ step_house_power_numeric
                         and (step_house_power_age_seconds | float(999999))
                             <= (failsafe_timeout_seconds | float(120)) }}
                    step_total_consumption: >-
                      {% if step_house_power_numeric %}
                        {{ step_house_power_state | float(0) }}
                      {% else %}
                        0
                      {% endif %}
                    step_grid_headroom: >-
                      {{ (active_grid_limit | float(0)) - (step_total_consumption | float(0)) }}
                    step_measured_charger_power: >-
                      {% if charger_power_sensor_input not in [none, '', 'none'] %}
                        {{ states(charger_power_sensor_input) | float(0) }}
                      {% else %}
                        0
                      {% endif %}
                    step_measured_charger_current: >-
                      {% if charger_current_sensor_input not in [none, '', 'none'] %}
                        {{ states(charger_current_sensor_input) | float(0) }}
                      {% else %}
                        0
                      {% endif %}
                    step_watts_per_amp: >-
                      {% if (step_measured_charger_power | float(0)) > 0
                            and (step_measured_charger_current | float(0)) > 0 %}
                        {{ (step_measured_charger_power | float(0))
                           / (step_measured_charger_current | float(0)) }}
                      {% else %}
                        {{ theoretical_watts_per_amp | float(230) }}
                      {% endif %}
                    step_watts_per_amp_source: >-
                      {% if (step_measured_charger_power | float(0)) > 0
                            and (step_measured_charger_current | float(0)) > 0 %}
                        measured
                      {% else %}
                        theoretical
                      {% endif %}
                    step_charging_state: >-
                      {% if charger_status_sensor_input not in [none, '', 'none']
                            and states(charger_status_sensor_input) | lower
                                not in ['unknown', 'unavailable', 'none', ''] %}
                        {{ states(charger_status_sensor_input) | lower }}
                      {% else %}
                        {{ states(sensor_charging_entity) | lower }}
                      {% endif %}
                    step_charger_consumption: >-
                      {% if step_charging_state in ['charging', 'charging_reduced', 'starting'] %}
                        {% if (step_measured_charger_power | float(0)) > 0 %}
                          {{ step_measured_charger_power | float(0) }}
                        {% else %}
                          {{ (step_current | float(0)) * (step_watts_per_amp | float(230)) }}
                        {% endif %}
                      {% else %}
                        0
                      {% endif %}
                    step_free_power: >-
                      {% set non_ev_load = [0, (step_total_consumption | float(0))
                                                - (step_charger_consumption | float(0))] | max %}
                      {% set candidate = (active_grid_limit | float(0)) - non_ev_load %}
                      {{ [0, candidate] | max }}
                    step_target: >-
                      {% set raw_amps = (step_free_power | float(0))
                                        / (step_watts_per_amp | float(230)) %}
                      {% if raw_amps > (max_amps | float) %}
                        {{ max_amps | float }}
                      {% elif raw_amps < (min_amps | float) %}
                        0
                      {% else %}
                        {{ raw_amps | int }}
                      {% endif %}
                    step_charger_vehicle_connected_ok: >-
                      {{ charger_vehicle_connected_sensor_input in [none, '', 'none']
                         or is_state(charger_vehicle_connected_sensor_input, 'on') }}
                    step_target_ev_charge_cable_ok: >-
                      {{ target_ev_charge_cable_sensor_input in [none, '', 'none']
                         or is_state(target_ev_charge_cable_sensor_input, 'on') }}

                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ not step_house_power_usable }}"
                      sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ debug_logging }}"
                              sequence:
                                - action: logbook.log
                                  data:
                                    name: Dynamic EV Charging v3.1 - Tesla Fleet
                                    entity_id: !input charging_current
                                    message: >-
                                      HOLD RAMP: whole-house power state='{{ step_house_power_state }}',
                                      age={{ step_house_power_age_seconds | round(0) }} s.
                                      No ramp-up command sent; normal control will resume
                                      when valid fresh house power returns.
                        - stop: Whole-house power became invalid during ramp-up

                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ not step_charger_vehicle_connected_ok
                               or not step_target_ev_charge_cable_ok
                               or step_charging_state not in eligible_states }}
                      sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ debug_logging }}"
                              sequence:
                                - action: logbook.log
                                  data:
                                    name: Dynamic EV Charging v3.1 - Tesla Fleet
                                    entity_id: !input charging_current
                                    message: >-
                                      HOLD RAMP: connection/state safety check failed;
                                      state={{ step_charging_state }}. No further commands sent.
                        - stop: Ramp-up safety gate failed

                    - conditions:
                        - condition: template
                          value_template: "{{ (step_target | float(0)) < (min_amps | float(0)) }}"
                      sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ charger_toggle_entity.startswith('switch.') }}"
                              sequence:
                                - action: switch.turn_off
                                  target:
                                    entity_id: !input charger_toggle
                          default:
                            - action: select.select_option
                              target:
                                entity_id: !input charger_toggle
                              data:
                                option: Stop charging
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ debug_logging }}"
                              sequence:
                                - action: logbook.log
                                  data:
                                    name: Dynamic EV Charging v3.1 - Tesla Fleet
                                    entity_id: !input charging_current
                                    message: >-
                                      STOP DURING RAMP: fresh house={{ step_total_consumption | round(0) }} W,
                                      target=0 A. Charging stopped.
                        - stop: Insufficient power during ramp-up

                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ (step_target | float(0)) < (step_current | float(0)) }}
                      sequence:
                        - repeat:
                            while:
                              - condition: template
                                value_template: >-
                                  {{ (states(charging_current_entity) | float(0))
                                     > (step_target | float(0)) }}
                            sequence:
                              - variables:
                                  ramp_down_current: "{{ states(charging_current_entity) | float(0) }}"
                              - action: number.set_value
                                target:
                                  entity_id: !input charging_current
                                data:
                                  value: >-
                                    {{ [ramp_down_current - (decrease_step_amps | float),
                                        step_target | float] | max }}
                              - delay:
                                  seconds: "{{ decrease_delay_seconds | int }}"
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ debug_logging }}"
                              sequence:
                                - action: logbook.log
                                  data:
                                    name: Dynamic EV Charging v3.1 - Tesla Fleet
                                    entity_id: !input charging_current
                                    message: >-
                                      RAMP REVERSED: fresh house={{ step_total_consumption | round(0) }} W,
                                      grid_headroom={{ step_grid_headroom | round(0) }} W,
                                      fresh target={{ step_target | round(0) }} A.
                        - stop: Fresh power reading requires ramp-down

                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ (step_target | float(0)) <=
                               (step_current | float(0)) }}
                      sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ debug_logging }}"
                              sequence:
                                - action: logbook.log
                                  data:
                                    name: Dynamic EV Charging v3.1 - Tesla Fleet
                                    entity_id: !input charging_current
                                    message: >-
                                      HOLD RAMP: fresh target={{ step_target | round(0) }} A
                                      has been reached by current={{ step_current | round(0) }} A;
                                      house={{ step_total_consumption | round(0) }} W,
                                      grid_headroom={{ step_grid_headroom | round(0) }} W,
                                      W/A={{ step_watts_per_amp | round(1) }}
                                      ({{ step_watts_per_amp_source }}).
                        - stop: Fresh target no longer requires ramp-up

                  default:
                    - action: number.set_value
                      target:
                        entity_id: !input charging_current
                      data:
                        value: >-
                          {{ [step_current + (increase_step_amps | float),
                              step_target | float,
                              max_amps | float] | min }}
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ debug_logging }}"
                          sequence:
                            - action: logbook.log
                              data:
                                name: Dynamic EV Charging v3.1 - Tesla Fleet
                                entity_id: !input charging_current
                                message: >-
                                  RAMP UP STEP: house={{ step_total_consumption | round(0) }} W,
                                  grid_headroom={{ step_grid_headroom | round(0) }} W,
                                  EV_budget={{ step_free_power | round(0) }} W,
                                  current={{ step_current | round(0) }} A,
                                  target={{ step_target | round(0) }} A,
                                  W/A={{ step_watts_per_amp | round(1) }}
                                  ({{ step_watts_per_amp_source }}).

          - stop: Restart sequence completed

  # 6. For an active session, reduce toward this run's initial calculated target.
  # This loop does not refresh house-power readings; see the README review.
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ (charging_current_value | float(0)) > (new_target_value | float(0)) }}
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ (states(charging_current_entity) | float(0)) > (new_target_value | float(0)) }}
              sequence:
                - variables:
                    current_amps_before_step: "{{ states(charging_current_entity) | float(0) }}"
                - action: number.set_value
                  target:
                    entity_id: !input charging_current
                  data:
                    value: >-
                      {{ [current_amps_before_step - (decrease_step_amps | float),
                          new_target_value | float] | max }}
                - delay:
                    seconds: "{{ decrease_delay_seconds | int }}"

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v3.1 - Tesla Fleet
                      entity_id: !input charging_current
                      message: >-
                        RAMP DOWN: house={{ total_consumption | round(0) }} W,
                        grid_headroom={{ grid_headroom | round(0) }} W,
                        charger={{ charger_consumption | round(0) }} W ({{ charger_power_source }}),
                        W/A={{ watts_per_amp | round(1) }} ({{ watts_per_amp_source }}),
                        EV_budget={{ actual_free_power | round(0) }} W,
                        target={{ new_target_value | round(0) }} A.
          - stop: Ramp-down completed

  # 7. Hold if no increase is needed or the increase is below the ramp-start threshold.
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ (new_target_value | float(0)) <= (charging_current_value | float(0))
                 or ((new_target_value | float(0)) - (charging_current_value | float(0)))
                    < (ramp_up_deadband_amps | float(0)) }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v3.1 - Tesla Fleet
                      entity_id: !input charging_current
                      message: >-
                        HOLD: current={{ charging_current_value | round(0) }} A,
                        target={{ new_target_value | round(0) }} A; upward difference is below
                        the {{ ramp_up_deadband_amps | round(0) }} A ramp-start deadband.
          - stop: Target is within ramp-up deadband

  # 8. Before increasing an active session, wait and recheck available power.
  - delay:
      seconds: "{{ ramp_up_stability_seconds | int }}"

  - variables:
      confirmed_house_power_state: "{{ states(sensor_house_power_entity) }}"
      confirmed_house_power_age_seconds: >-
        {% set power_state = states[sensor_house_power_entity] %}
        {{ [0, as_timestamp(now()) - as_timestamp(power_state.last_updated)] | max }}
      confirmed_house_power_numeric: "{{ is_number(confirmed_house_power_state) }}"
      confirmed_house_power_usable: >-
        {{ confirmed_house_power_numeric
           and (confirmed_house_power_age_seconds | float(999999))
               <= (failsafe_timeout_seconds | float(120)) }}
      confirmed_total_consumption: >-
        {% if confirmed_house_power_numeric %}
          {{ confirmed_house_power_state | float(0) }}
        {% else %}
          0
        {% endif %}
      confirmed_grid_headroom: >-
        {{ (active_grid_limit | float(0)) - (confirmed_total_consumption | float(0)) }}
      confirmed_charging_state: >-
        {% if charger_status_sensor_input not in [none, '', 'none']
              and states(charger_status_sensor_input) | lower not in ['unknown', 'unavailable', 'none', ''] %}
          {{ states(charger_status_sensor_input) | lower }}
        {% else %}
          {{ states(sensor_charging_entity) | lower }}
        {% endif %}
      confirmed_current: "{{ states(charging_current_entity) | float(0) }}"
      confirmed_charger_consumption: >-
        {% if confirmed_charging_state in ['charging', 'charging_reduced', 'starting'] %}
          {% if charger_power_sensor_input not in [none, '', 'none']
                and (states(charger_power_sensor_input) | float(0)) > 0 %}
            {{ states(charger_power_sensor_input) | float(0) }}
          {% else %}
            {{ (confirmed_current | float(0)) * (watts_per_amp | float(230)) }}
          {% endif %}
        {% else %}
          0
        {% endif %}
      confirmed_free_power: >-
        {% set non_ev_load = [0, (confirmed_total_consumption | float(0))
                                  - (confirmed_charger_consumption | float(0))] | max %}
        {% set candidate = (active_grid_limit | float(0)) - non_ev_load %}
        {{ [0, candidate] | max }}
      confirmed_target: >-
        {% set raw_amps = (confirmed_free_power | float(0)) / (watts_per_amp | float(230)) %}
        {% if raw_amps > (max_amps | float) %}
          {{ max_amps | float }}
        {% elif raw_amps < (min_amps | float) %}
          0
        {% else %}
          {{ raw_amps | int }}
        {% endif %}

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ not confirmed_house_power_usable }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v3.1 - Tesla Fleet
                      entity_id: !input charging_current
                      message: >-
                        HOLD AFTER STABILITY CHECK: whole-house power state='{{ confirmed_house_power_state }}',
                        age={{ confirmed_house_power_age_seconds | round(0) }} s.
                        No ramp-up command sent; current charging setting is held.
          - stop: Whole-house power invalid after ramp-up stability delay

      - conditions:
          - condition: template
            value_template: "{{ (confirmed_target | float(0)) < (min_amps | float(0)) }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ charger_toggle_entity.startswith('switch.') }}"
                sequence:
                  - action: switch.turn_off
                    target:
                      entity_id: !input charger_toggle
            default:
              - action: select.select_option
                target:
                  entity_id: !input charger_toggle
                data:
                  option: Stop charging

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v3.1 - Tesla Fleet
                      entity_id: !input charging_current
                      message: >-
                        STOP AFTER STABILITY CHECK: house={{ confirmed_total_consumption | round(0) }} W,
                        grid_headroom={{ confirmed_grid_headroom | round(0) }} W,
                        EV_budget={{ confirmed_free_power | round(0) }} W,
                        fresh target=0 A. Charging stopped.
          - stop: Stability check found insufficient power to continue charging

      - conditions:
          - condition: template
            value_template: >-
              {{ (confirmed_target | float(0)) < (confirmed_current | float(0)) }}
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ (states(charging_current_entity) | float(0))
                       > (confirmed_target | float(0)) }}
              sequence:
                - variables:
                    stability_ramp_down_current: "{{ states(charging_current_entity) | float(0) }}"
                - action: number.set_value
                  target:
                    entity_id: !input charging_current
                  data:
                    value: >-
                      {{ [stability_ramp_down_current - (decrease_step_amps | float),
                          confirmed_target | float] | max }}
                - delay:
                    seconds: "{{ decrease_delay_seconds | int }}"

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v3.1 - Tesla Fleet
                      entity_id: !input charging_current
                      message: >-
                        RAMP DOWN AFTER STABILITY CHECK:
                        house={{ confirmed_total_consumption | round(0) }} W,
                        grid_headroom={{ confirmed_grid_headroom | round(0) }} W,
                        EV_budget={{ confirmed_free_power | round(0) }} W,
                        current was={{ confirmed_current | round(0) }} A,
                        fresh target={{ confirmed_target | round(0) }} A.
          - stop: Stability check required ramp-down

      - conditions:
          - condition: template
            value_template: >-
              {{ (confirmed_target | float(0)) > (confirmed_current | float(0))
                 and ((confirmed_target | float(0)) - (confirmed_current | float(0)))
                     >= (ramp_up_deadband_amps | float(0)) }}
        sequence:
          # Keep one automation run in control of the ramp. Before every increase,
          # wait the configured step delay and recalculate from fresh sensor values.
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ (states(charging_current_entity) | float(0)) < (max_amps | float(0)) }}
              sequence:
                - delay:
                    seconds: "{{ increase_delay_seconds | int }}"

                - variables:
                    step_current: "{{ states(charging_current_entity) | float(0) }}"
                    step_house_power_state: "{{ states(sensor_house_power_entity) }}"
                    step_house_power_age_seconds: >-
                      {% set power_state = states[sensor_house_power_entity] %}
                      {{ [0, as_timestamp(now()) - as_timestamp(power_state.last_updated)] | max }}
                    step_house_power_numeric: "{{ is_number(step_house_power_state) }}"
                    step_house_power_usable: >-
                      {{ step_house_power_numeric
                         and (step_house_power_age_seconds | float(999999))
                             <= (failsafe_timeout_seconds | float(120)) }}
                    step_total_consumption: >-
                      {% if step_house_power_numeric %}
                        {{ step_house_power_state | float(0) }}
                      {% else %}
                        0
                      {% endif %}
                    step_grid_headroom: >-
                      {{ (active_grid_limit | float(0)) - (step_total_consumption | float(0)) }}
                    step_measured_charger_power: >-
                      {% if charger_power_sensor_input not in [none, '', 'none'] %}
                        {{ states(charger_power_sensor_input) | float(0) }}
                      {% else %}
                        0
                      {% endif %}
                    step_measured_charger_current: >-
                      {% if charger_current_sensor_input not in [none, '', 'none'] %}
                        {{ states(charger_current_sensor_input) | float(0) }}
                      {% else %}
                        0
                      {% endif %}
                    step_watts_per_amp: >-
                      {% if (step_measured_charger_power | float(0)) > 0
                            and (step_measured_charger_current | float(0)) > 0 %}
                        {{ (step_measured_charger_power | float(0))
                           / (step_measured_charger_current | float(0)) }}
                      {% else %}
                        {{ theoretical_watts_per_amp | float(230) }}
                      {% endif %}
                    step_watts_per_amp_source: >-
                      {% if (step_measured_charger_power | float(0)) > 0
                            and (step_measured_charger_current | float(0)) > 0 %}
                        measured
                      {% else %}
                        theoretical
                      {% endif %}
                    step_charging_state: >-
                      {% if charger_status_sensor_input not in [none, '', 'none']
                            and states(charger_status_sensor_input) | lower
                                not in ['unknown', 'unavailable', 'none', ''] %}
                        {{ states(charger_status_sensor_input) | lower }}
                      {% else %}
                        {{ states(sensor_charging_entity) | lower }}
                      {% endif %}
                    step_charger_consumption: >-
                      {% if step_charging_state in ['charging', 'charging_reduced', 'starting'] %}
                        {% if (step_measured_charger_power | float(0)) > 0 %}
                          {{ step_measured_charger_power | float(0) }}
                        {% else %}
                          {{ (step_current | float(0)) * (step_watts_per_amp | float(230)) }}
                        {% endif %}
                      {% else %}
                        0
                      {% endif %}
                    step_free_power: >-
                      {% set non_ev_load = [0, (step_total_consumption | float(0))
                                                - (step_charger_consumption | float(0))] | max %}
                      {% set candidate = (active_grid_limit | float(0)) - non_ev_load %}
                      {{ [0, candidate] | max }}
                    step_target: >-
                      {% set raw_amps = (step_free_power | float(0))
                                        / (step_watts_per_amp | float(230)) %}
                      {% if raw_amps > (max_amps | float) %}
                        {{ max_amps | float }}
                      {% elif raw_amps < (min_amps | float) %}
                        0
                      {% else %}
                        {{ raw_amps | int }}
                      {% endif %}
                    step_charger_vehicle_connected_ok: >-
                      {{ charger_vehicle_connected_sensor_input in [none, '', 'none']
                         or is_state(charger_vehicle_connected_sensor_input, 'on') }}
                    step_target_ev_charge_cable_ok: >-
                      {{ target_ev_charge_cable_sensor_input in [none, '', 'none']
                         or is_state(target_ev_charge_cable_sensor_input, 'on') }}

                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ not step_house_power_usable }}"
                      sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ debug_logging }}"
                              sequence:
                                - action: logbook.log
                                  data:
                                    name: Dynamic EV Charging v3.1 - Tesla Fleet
                                    entity_id: !input charging_current
                                    message: >-
                                      HOLD RAMP: whole-house power state='{{ step_house_power_state }}',
                                      age={{ step_house_power_age_seconds | round(0) }} s.
                                      No ramp-up command sent; normal control will resume
                                      when valid fresh house power returns.
                        - stop: Whole-house power became invalid during ramp-up

                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ not step_charger_vehicle_connected_ok
                               or not step_target_ev_charge_cable_ok
                               or step_charging_state not in eligible_states }}
                      sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ debug_logging }}"
                              sequence:
                                - action: logbook.log
                                  data:
                                    name: Dynamic EV Charging v3.1 - Tesla Fleet
                                    entity_id: !input charging_current
                                    message: >-
                                      HOLD RAMP: connection/state safety check failed;
                                      state={{ step_charging_state }}. No further commands sent.
                        - stop: Ramp-up safety gate failed

                    - conditions:
                        - condition: template
                          value_template: "{{ (step_target | float(0)) < (min_amps | float(0)) }}"
                      sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ charger_toggle_entity.startswith('switch.') }}"
                              sequence:
                                - action: switch.turn_off
                                  target:
                                    entity_id: !input charger_toggle
                          default:
                            - action: select.select_option
                              target:
                                entity_id: !input charger_toggle
                              data:
                                option: Stop charging
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ debug_logging }}"
                              sequence:
                                - action: logbook.log
                                  data:
                                    name: Dynamic EV Charging v3.1 - Tesla Fleet
                                    entity_id: !input charging_current
                                    message: >-
                                      STOP DURING RAMP: fresh house={{ step_total_consumption | round(0) }} W,
                                      target=0 A. Charging stopped.
                        - stop: Insufficient power during ramp-up

                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ (step_target | float(0)) < (step_current | float(0)) }}
                      sequence:
                        - repeat:
                            while:
                              - condition: template
                                value_template: >-
                                  {{ (states(charging_current_entity) | float(0))
                                     > (step_target | float(0)) }}
                            sequence:
                              - variables:
                                  ramp_down_current: "{{ states(charging_current_entity) | float(0) }}"
                              - action: number.set_value
                                target:
                                  entity_id: !input charging_current
                                data:
                                  value: >-
                                    {{ [ramp_down_current - (decrease_step_amps | float),
                                        step_target | float] | max }}
                              - delay:
                                  seconds: "{{ decrease_delay_seconds | int }}"
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ debug_logging }}"
                              sequence:
                                - action: logbook.log
                                  data:
                                    name: Dynamic EV Charging v3.1 - Tesla Fleet
                                    entity_id: !input charging_current
                                    message: >-
                                      RAMP REVERSED: fresh house={{ step_total_consumption | round(0) }} W,
                                      grid_headroom={{ step_grid_headroom | round(0) }} W,
                                      fresh target={{ step_target | round(0) }} A.
                        - stop: Fresh power reading requires ramp-down

                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ (step_target | float(0)) <=
                               (step_current | float(0)) }}
                      sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ debug_logging }}"
                              sequence:
                                - action: logbook.log
                                  data:
                                    name: Dynamic EV Charging v3.1 - Tesla Fleet
                                    entity_id: !input charging_current
                                    message: >-
                                      HOLD RAMP: fresh target={{ step_target | round(0) }} A
                                      has been reached by current={{ step_current | round(0) }} A;
                                      house={{ step_total_consumption | round(0) }} W,
                                      grid_headroom={{ step_grid_headroom | round(0) }} W,
                                      W/A={{ step_watts_per_amp | round(1) }}
                                      ({{ step_watts_per_amp_source }}).
                        - stop: Fresh target no longer requires ramp-up

                  default:
                    - action: number.set_value
                      target:
                        entity_id: !input charging_current
                      data:
                        value: >-
                          {{ [step_current + (increase_step_amps | float),
                              step_target | float,
                              max_amps | float] | min }}
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ debug_logging }}"
                          sequence:
                            - action: logbook.log
                              data:
                                name: Dynamic EV Charging v3.1 - Tesla Fleet
                                entity_id: !input charging_current
                                message: >-
                                  RAMP UP STEP: house={{ step_total_consumption | round(0) }} W,
                                  grid_headroom={{ step_grid_headroom | round(0) }} W,
                                  EV_budget={{ step_free_power | round(0) }} W,
                                  current={{ step_current | round(0) }} A,
                                  target={{ step_target | round(0) }} A,
                                  W/A={{ step_watts_per_amp | round(1) }}
                                  ({{ step_watts_per_amp_source }}).

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v3.1 - Tesla Fleet
                      entity_id: !input charging_current
                      message: >-
                        RAMP UP COMPLETE: reached Maximum Charging Current
                        ({{ max_amps | round(0) }} A).
    default:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ debug_logging }}"
            sequence:
              - action: logbook.log
                data:
                  name: Dynamic EV Charging v3.1 - Tesla Fleet
                  entity_id: !input charging_current
                  message: >-
                    HOLD AFTER STABILITY CHECK: fresh target={{ confirmed_target | round(0) }} A,
                    current={{ confirmed_current | round(0) }} A.

mode: single
max_exceeded: silent

