blueprint:
  name: Dynamic EV Charging Automation v2.4
  description: |
    ## Dynamic EV Charging Automation v2.4

    Tesla Fleet-focused fork of the original Dynamic EV Charging Automation.

    ### What's new in v2.4
    - Direct Tesla Fleet start/stop support through `switch` entities.
    - Independent ramp-up and ramp-down step sizes and delays.
    - Single-phase 230 V, three-phase 230 V, and three-phase 400 V supply presets.
    - One simple **Maximum Grid Draw** limit for the whole house.
    - Optional local charger status, power, current, and vehicle-connected sensors.
    - Optional target-EV charge-cable safety gate for shared chargers.
    - Measured **W/A calibration** when both charger power and charger current are available.
    - Configurable starting charging current.
    - Ramp-up deadband, initial stability check, and fresh power checks before every increase step.
    - Fixed one-minute idle re-evaluation with single-run control so scheduled triggers cannot interrupt an active ramp.
    - Five-minute restart lockout by default.
    - Optional Home Assistant Logbook debug messages.
    - Optional location tracking; leave it empty to disable the location check.

    ### CAR vs CHARGER inputs
    Inputs are labelled so it is clear where the entity should come from:

    - **[CAR]** = vehicle entity, normally Tesla Fleet.
    - **[CHARGER]** = local wall charger entity, for example Tesla Wall Connector.
    - **[HOUSE]** = whole-house power meter, for example Tibber Pulse.

    Local CHARGER sensors are preferred for fast status and measured power/current.
    CAR entities remain the command path for starting/stopping charging and setting current.

    Existing `select`-based charger controls remain supported.

  domain: automation

  input:
    device_tracker:
      name: "[CAR/PERSON] Location Tracker (Optional)"
      description: "CAR/PERSON sensor. Optional location check. Leave empty to allow charging control regardless of tracker state."
      default: ""
      selector:
        entity:
          domain: device_tracker

    sensor_charging:
      name: "[CAR] EV Charging State Sensor"
      description: >
        CAR sensor, normally from Tesla Fleet. Select the vehicle's charging-state sensor.
        It is used as a fallback when the local CHARGER status sensor is not configured
        or is unavailable. Typical Tesla states include starting, charging, stopped,
        complete, disconnected, and no_power.
      default: sensor.ev_charger_estado
      selector:
        entity:
          domain: sensor

    charger_toggle:
      name: "[CAR] Charging Start/Stop Control"
      description: >
        CAR control, normally from Tesla Fleet. Select the vehicle's charge start/stop
        entity. Supports select entities using "Start charging" / "Stop charging" and
        switch entities where turn_on starts charging and turn_off stops charging.
      default: select.ev_charger_toggle_charging
      selector:
        entity:
          domain:
            - select
            - switch

    sensor_house_power:
      name: "[HOUSE] Whole-House Power Sensor"
      description: "HOUSE sensor. Select total household power draw in watts. A fast-updating source such as Tibber Pulse is recommended."
      default: sensor.shellyemg3_8cbfea96acd8_em1_power
      selector:
        entity:
          domain: sensor
          device_class: power

    charger_power_sensor:
      name: "[CHARGER] Actual Power Sensor (Optional)"
      description: >
        CHARGER sensor, normally from the local wall charger integration. Select measured
        charger power in watts, for example Tesla Wall Connector total power / Billader.
        Leave empty to estimate charger power from the selected electrical supply.
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: power

    charger_current_sensor:
      name: "[CHARGER] Actual Current Sensor (Optional)"
      description: >
        CHARGER sensor, normally from the local wall charger integration. Select measured
        charger current in amps, for example Tesla Wall Connector Vehicle current. When
        both CHARGER power and current are valid, measured W/A is used for target-current
        calculations. Leave empty to use the selected electrical supply as fallback.
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: current

    charger_status_sensor:
      name: "[CHARGER] Local Status Sensor (Optional)"
      description: >
        CHARGER sensor from the local wall charger integration. This is preferred over
        slower CAR telemetry for charging-state decisions. For Tesla Wall Connector use
        sensor.tesla_wall_connector_status.
      default: ""
      selector:
        entity:
          domain: sensor

    charger_vehicle_connected_sensor:
      name: "[CHARGER] Vehicle Connected Sensor (Optional)"
      description: >
        CHARGER sensor. Confirms that some vehicle is physically connected to this wall
        charger. For Tesla Wall Connector use
        binary_sensor.tesla_wall_connector_vehicle_connected. If configured and not ON,
        the automation sends no charging commands.
      default: ""
      selector:
        entity:
          domain: binary_sensor

    target_ev_charge_cable_sensor:
      name: "[CAR] Target EV Charge Cable Sensor (Optional)"
      description: >
        CAR sensor, normally from Tesla Fleet. Select the charge-cable sensor belonging to
        the specific EV controlled by this automation. If configured and not ON, no charging
        commands are sent to that EV. Strongly recommended when the CHARGER may be shared
        by multiple vehicles.
      default: ""
      selector:
        entity:
          domain: binary_sensor

    max_grid_power:
      name: Maximum Grid Draw (W)
      description: Maximum total household power draw in watts. The EV charging target is adjusted to keep the whole house at or below this limit.
      default: 9000
      selector:
        number:
          min: 0
          max: 30000
          step: 100

    charging_current:
      name: "[CAR] Charging Current Control"
      description: "CAR control, normally from Tesla Fleet. Select the vehicle number entity used to request charging current in amps."
      default: number.ev_charger_set_charge_current
      selector:
        entity:
          domain: number

    supply_type:
      name: Charging Supply
      description: >
        Electrical supply used as the fallback watts-per-amp calculation. If valid measured
        charger power and current sensors are configured, measured W/A takes priority.
      default: single_phase_230
      selector:
        select:
          options:
            - label: "Single-phase 230 V"
              value: single_phase_230
            - label: "Three-phase 230 V"
              value: three_phase_230
            - label: "Three-phase 400 V"
              value: three_phase_400

    max_amps:
      name: Maximum Charging Current (A)
      description: Highest charging current the automation may request.
      default: 20
      selector:
        number:
          min: 6
          max: 32
          step: 1

    min_amps:
      name: Minimum Charging Current (A)
      description: >
        Lowest charging current the automation may request. If the safe target falls below
        this value, charging is stopped instead. Some EVs/chargers may enforce a higher
        physical minimum than the value selected here.
      default: 1
      selector:
        number:
          min: 1
          max: 32
          step: 1

    starting_amps:
      name: Starting Charging Current (A)
      description: >
        Preferred current requested immediately before starting or restarting charging.
        It is automatically clamped so it never exceeds the current safe target or
        Maximum Charging Current.
      default: 6
      selector:
        number:
          min: 1
          max: 32
          step: 1

    increase_step_amps:
      name: Ramp-Up Step Size (A)
      description: Number of amps added per ramp-up step.
      default: 1
      selector:
        number:
          min: 1
          max: 10
          step: 1

    increase_delay_seconds:
      name: Ramp-Up Step Delay (seconds)
      description: Delay between consecutive ramp-up steps.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1

    decrease_step_amps:
      name: Ramp-Down Step Size (A)
      description: Number of amps removed per ramp-down step.
      default: 2
      selector:
        number:
          min: 1
          max: 10
          step: 1

    decrease_delay_seconds:
      name: Ramp-Down Step Delay (seconds)
      description: Delay between consecutive ramp-down steps.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1

    ramp_up_deadband_amps:
      name: Ramp-Up Deadband (A)
      description: >
        Suppresses small upward target changes to reduce unnecessary commands.
        Ramp-down is never blocked by this setting.
      default: 1
      selector:
        number:
          min: 0
          max: 5
          step: 1

    ramp_up_stability_seconds:
      name: Ramp-Up Stability Time (seconds)
      description: >
        Before ramp-up begins, wait this long and recalculate using a fresh whole-house
        power value. During ramp-up, the blueprint then re-reads house power and charger
        measurements before every increase step.
      default: 30
      selector:
        number:
          min: 0
          max: 300
          step: 5

    restart_delay_seconds:
      name: Restart Lockout After Stop (seconds)
      description: >
        Minimum delay before charging may restart after a stop/off state. This reduces
        repeated start/stop cycling. Default is 300 seconds (5 minutes).
      default: 300
      selector:
        number:
          min: 0
          max: 1800
          step: 30

    debug_logging:
      name: Debug Logging
      description: >
        Write charging decisions and calculation details to the Home Assistant Logbook.
        Recommended while testing or tuning the blueprint.
      default: false
      selector:
        boolean:


triggers:
  - trigger: time_pattern
    minutes: "/1"

variables:
  device_tracker_input: !input device_tracker

condition:
  - condition: template
    value_template: >-
      {{ device_tracker_input in [none, '', 'none']
         or is_state(device_tracker_input, 'home') }}

action:
  - variables:
      supply_type: !input supply_type
      max_amps: !input max_amps
      min_amps: !input min_amps
      starting_amps: !input starting_amps
      increase_step_amps: !input increase_step_amps
      increase_delay_seconds: !input increase_delay_seconds
      decrease_step_amps: !input decrease_step_amps
      decrease_delay_seconds: !input decrease_delay_seconds
      ramp_up_deadband_amps: !input ramp_up_deadband_amps
      ramp_up_stability_seconds: !input ramp_up_stability_seconds
      restart_delay_seconds: !input restart_delay_seconds
      debug_logging: !input debug_logging

      sensor_house_power_entity: !input sensor_house_power
      charger_power_sensor_input: !input charger_power_sensor
      charger_current_sensor_input: !input charger_current_sensor
      charger_status_sensor_input: !input charger_status_sensor
      charger_vehicle_connected_sensor_input: !input charger_vehicle_connected_sensor
      target_ev_charge_cable_sensor_input: !input target_ev_charge_cable_sensor
      charging_current_entity: !input charging_current
      sensor_charging_entity: !input sensor_charging
      charger_toggle_entity: !input charger_toggle

      charger_vehicle_connected_ok: >-
        {{ charger_vehicle_connected_sensor_input in [none, '', 'none']
           or is_state(charger_vehicle_connected_sensor_input, 'on') }}
      target_ev_charge_cable_ok: >-
        {{ target_ev_charge_cable_sensor_input in [none, '', 'none']
           or is_state(target_ev_charge_cable_sensor_input, 'on') }}

      active_grid_limit: !input max_grid_power

      theoretical_watts_per_amp: >-
        {% if supply_type == 'single_phase_230' %}
          {{ 230 }}
        {% elif supply_type == 'three_phase_230' %}
          {{ 230 * 1.7320508075688772 }}
        {% else %}
          {{ 400 * 1.7320508075688772 }}
        {% endif %}

      fleet_charging_state: "{{ states(sensor_charging_entity) | lower }}"
      local_charger_state: >-
        {% if charger_status_sensor_input not in [none, '', 'none'] %}
          {{ states(charger_status_sensor_input) | lower }}
        {% else %}
          unavailable
        {% endif %}
      charging_state: >-
        {% if charger_status_sensor_input not in [none, '', 'none']
              and local_charger_state not in ['unknown', 'unavailable', 'none', ''] %}
          {{ local_charger_state }}
        {% else %}
          {{ fleet_charging_state }}
        {% endif %}
      status_entity_for_timing: >-
        {% if charger_status_sensor_input not in [none, '', 'none']
              and local_charger_state not in ['unknown', 'unavailable', 'none', ''] %}
          {{ charger_status_sensor_input }}
        {% else %}
          {{ sensor_charging_entity }}
        {% endif %}
      charging_current_value: "{{ states(charging_current_entity) | float(0) }}"
      total_consumption: "{{ states(sensor_house_power_entity) | float(0) }}"

      measured_charger_power: >-
        {% if charger_power_sensor_input not in [none, '', 'none'] %}
          {{ states(charger_power_sensor_input) | float(0) }}
        {% else %}
          0
        {% endif %}

      measured_charger_current: >-
        {% if charger_current_sensor_input not in [none, '', 'none'] %}
          {{ states(charger_current_sensor_input) | float(0) }}
        {% else %}
          0
        {% endif %}

      watts_per_amp_source: >-
        {% if (measured_charger_power | float(0)) > 0
              and (measured_charger_current | float(0)) > 0 %}
          measured
        {% else %}
          theoretical
        {% endif %}

      watts_per_amp: >-
        {% if watts_per_amp_source == 'measured' %}
          {{ (measured_charger_power | float(0)) / (measured_charger_current | float(0)) }}
        {% else %}
          {{ theoretical_watts_per_amp | float(230) }}
        {% endif %}

      charger_power_source: >-
        {% if charger_power_sensor_input not in [none, '', 'none']
              and (measured_charger_power | float(0)) > 0 %}
          measured
        {% else %}
          estimated
        {% endif %}

      charger_consumption: >-
        {% if charger_power_source == 'measured' %}
          {{ measured_charger_power | float(0) }}
        {% elif charging_state in ['charging', 'charging_reduced', 'starting'] %}
          {{ (charging_current_value | float(0)) * (watts_per_amp | float(230)) }}
        {% else %}
          0
        {% endif %}

      actual_free_power: >-
        {{ [0, (active_grid_limit | float(0)) - (total_consumption | float(0)) + (charger_consumption | float(0))] | max }}

      new_target_value: >-
        {% set raw_amps = (actual_free_power | float(0)) / (watts_per_amp | float(230)) %}
        {% if raw_amps > (max_amps | float) %}
          {{ max_amps | float }}
        {% elif raw_amps < (min_amps | float) %}
          0
        {% else %}
          {{ raw_amps | int }}
        {% endif %}

      stopped_seconds: >-
        {% if charger_toggle_entity.startswith('switch.') and is_state(charger_toggle_entity, 'off') %}
          {{ as_timestamp(now()) - as_timestamp(states[charger_toggle_entity].last_changed) }}
        {% elif charging_state in ['stopped', 'no_power', 'ready', 'connected', 'waiting_car', 'negotiating', 'plugged_in', 'waiting', 'waiting_for_authorization'] %}
          {{ as_timestamp(now()) - as_timestamp(states[status_entity_for_timing].last_changed) }}
        {% else %}
          0
        {% endif %}

      eligible_states:
        - charging
        - charging_reduced
        - starting
        - stopped
        - no_power
        - ready
        - connected
        - waiting_car
        - negotiating
        - plugged_in
        - waiting
        - waiting_for_authorization

  # Shared-charger safety gates: do not send commands unless the local charger and
  # target EV connection checks pass when those optional sensors are configured.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ not charger_vehicle_connected_ok }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v2.4
                      entity_id: !input sensor_charging
                      message: >-
                        HOLD: local charger does not report a vehicle connected.
                        No Tesla/EV charging commands were sent.
          - stop: No vehicle is connected to the configured charger

      - conditions:
          - condition: template
            value_template: "{{ not target_ev_charge_cable_ok }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v2.4
                      entity_id: !input sensor_charging
                      message: >-
                        HOLD: target EV charge-cable sensor is not ON.
                        No charging commands were sent to the target EV.
          - stop: Target EV charge cable is not connected

  # Do not interfere when charging is complete, disconnected, unavailable, or in an unsupported state.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ charging_state not in eligible_states }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v2.4
                      entity_id: !input sensor_charging
                      message: >-
                        HOLD: charging state '{{ charging_state }}' is not eligible for dynamic control.
          - stop: Charging state is not eligible for dynamic control

  # Stop charging when available power is below the configured minimum.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ (new_target_value | float(0)) < (min_amps | float) }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ charger_toggle_entity.startswith('switch.') }}"
                sequence:
                  - action: switch.turn_off
                    target:
                      entity_id: !input charger_toggle
            default:
              - action: select.select_option
                target:
                  entity_id: !input charger_toggle
                data:
                  option: Stop charging

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v2.4
                      entity_id: !input charging_current
                      message: >-
                        STOP: house={{ total_consumption | round(0) }} W,
                        charger={{ charger_consumption | round(0) }} W ({{ charger_power_source }}),
                        W/A={{ watts_per_amp | round(1) }} ({{ watts_per_amp_source }}),
                        limit={{ active_grid_limit | round(0) }} W,
                        free={{ actual_free_power | round(0) }} W,
                        target=0 A, state={{ charging_state }}.
          - stop: Not enough power to charge above the minimum current

  # Startable idle states enter the restart/start sequence.
  # The 5-minute lockout applies specifically to stopped/no_power.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ charging_state in ['stopped', 'no_power', 'ready', 'connected', 'waiting_car', 'negotiating', 'plugged_in', 'waiting', 'waiting_for_authorization'] }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ (charger_toggle_entity.startswith('switch.') and is_state(charger_toggle_entity, 'off')
                          or charging_state in ['stopped', 'no_power'])
                         and (stopped_seconds | float(0)) < (restart_delay_seconds | float(0)) }}
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ debug_logging }}"
                        sequence:
                          - action: logbook.log
                            data:
                              name: Dynamic EV Charging v2.4
                              entity_id: !input sensor_charging
                              message: >-
                                WAIT TO RESTART: stopped for {{ stopped_seconds | int }} s;
                                restart lockout={{ restart_delay_seconds | int }} s.
                  - stop: Restart lockout is still active

          # Require stable spare power and recalculate from fresh sensor values before restarting.
          - delay:
              seconds: "{{ ramp_up_stability_seconds | int }}"

          - variables:
              confirmed_total_consumption: "{{ states(sensor_house_power_entity) | float(0) }}"
              confirmed_free_power: >-
                {{ [0, (active_grid_limit | float(0)) - (states(sensor_house_power_entity) | float(0))] | max }}
              confirmed_target: >-
                {% set raw_amps = (confirmed_free_power | float(0)) / (watts_per_amp | float(230)) %}
                {% if raw_amps > (max_amps | float) %}
                  {{ max_amps | float }}
                {% elif raw_amps < (min_amps | float) %}
                  0
                {% else %}
                  {{ raw_amps | int }}
                {% endif %}
              safe_start_amps: >-
                {{ [starting_amps | float, confirmed_target | float, max_amps | float] | min }}

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (confirmed_target | float(0)) >= (min_amps | float) }}"
                sequence:
                  # Set the configured starting current, clamped to the safe target.
                  - action: number.set_value
                    target:
                      entity_id: !input charging_current
                    data:
                      value: "{{ safe_start_amps | float }}"

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ charger_toggle_entity.startswith('switch.') }}"
                        sequence:
                          - action: switch.turn_on
                            target:
                              entity_id: !input charger_toggle
                    default:
                      - action: select.select_option
                        target:
                          entity_id: !input charger_toggle
                        data:
                          option: Start charging

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ debug_logging }}"
                        sequence:
                          - action: logbook.log
                            data:
                              name: Dynamic EV Charging v2.4
                              entity_id: !input charging_current
                              message: >-
                                {% if charger_toggle_entity.startswith('switch.') %}
                                  START COMMAND SENT – Tesla Fleet will wake vehicle automatically if required.
                                {% else %}
                                  START COMMAND SENT via select-based charger control.
                                {% endif %}
                                Requested start current={{ safe_start_amps | round(0) }} A
                                (configured={{ starting_amps | round(0) }} A,
                                safe target={{ confirmed_target | round(0) }} A).

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ debug_logging }}"
                        sequence:
                          - action: logbook.log
                            data:
                              name: Dynamic EV Charging v2.4
                              entity_id: !input charging_current
                              message: >-
                                RESTART: stable free power={{ confirmed_free_power | round(0) }} W,
                                confirmed target={{ confirmed_target | round(0) }} A.
            default:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ debug_logging }}"
                    sequence:
                      - action: logbook.log
                        data:
                          name: Dynamic EV Charging v2.4
                          entity_id: !input sensor_charging
                          message: >-
                            HOLD STOPPED: power was not still sufficient after
                            {{ ramp_up_stability_seconds | int }} s stability check.
              - stop: Spare power was not stable enough to restart

          # Ramp from the configured start current. Before every increase step,
          # re-read Tibber/house power and local charger measurements.
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ (states(charging_current_entity) | float(0)) < (max_amps | float(0)) }}
              sequence:
                - delay:
                    seconds: "{{ increase_delay_seconds | int }}"

                - variables:
                    step_current: "{{ states(charging_current_entity) | float(0) }}"
                    step_total_consumption: "{{ states(sensor_house_power_entity) | float(0) }}"
                    step_measured_charger_power: >-
                      {% if charger_power_sensor_input not in [none, '', 'none'] %}
                        {{ states(charger_power_sensor_input) | float(0) }}
                      {% else %}
                        0
                      {% endif %}
                    step_measured_charger_current: >-
                      {% if charger_current_sensor_input not in [none, '', 'none'] %}
                        {{ states(charger_current_sensor_input) | float(0) }}
                      {% else %}
                        0
                      {% endif %}
                    step_watts_per_amp: >-
                      {% if (step_measured_charger_power | float(0)) > 0
                            and (step_measured_charger_current | float(0)) > 0 %}
                        {{ (step_measured_charger_power | float(0))
                           / (step_measured_charger_current | float(0)) }}
                      {% else %}
                        {{ theoretical_watts_per_amp | float(230) }}
                      {% endif %}
                    step_watts_per_amp_source: >-
                      {% if (step_measured_charger_power | float(0)) > 0
                            and (step_measured_charger_current | float(0)) > 0 %}
                        measured
                      {% else %}
                        theoretical
                      {% endif %}
                    step_charging_state: >-
                      {% if charger_status_sensor_input not in [none, '', 'none']
                            and states(charger_status_sensor_input) | lower
                                not in ['unknown', 'unavailable', 'none', ''] %}
                        {{ states(charger_status_sensor_input) | lower }}
                      {% else %}
                        {{ states(sensor_charging_entity) | lower }}
                      {% endif %}
                    step_charger_consumption: >-
                      {% if (step_measured_charger_power | float(0)) > 0 %}
                        {{ step_measured_charger_power | float(0) }}
                      {% elif step_charging_state in ['charging', 'charging_reduced', 'starting'] %}
                        {{ (step_current | float(0)) * (step_watts_per_amp | float(230)) }}
                      {% else %}
                        0
                      {% endif %}
                    step_free_power: >-
                      {{ [0, (active_grid_limit | float(0))
                            - (step_total_consumption | float(0))
                            + (step_charger_consumption | float(0))] | max }}
                    step_target: >-
                      {% set raw_amps = (step_free_power | float(0))
                                        / (step_watts_per_amp | float(230)) %}
                      {% if raw_amps > (max_amps | float) %}
                        {{ max_amps | float }}
                      {% elif raw_amps < (min_amps | float) %}
                        0
                      {% else %}
                        {{ raw_amps | int }}
                      {% endif %}
                    step_charger_vehicle_connected_ok: >-
                      {{ charger_vehicle_connected_sensor_input in [none, '', 'none']
                         or is_state(charger_vehicle_connected_sensor_input, 'on') }}
                    step_target_ev_charge_cable_ok: >-
                      {{ target_ev_charge_cable_sensor_input in [none, '', 'none']
                         or is_state(target_ev_charge_cable_sensor_input, 'on') }}

                - choose:
                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ not step_charger_vehicle_connected_ok
                               or not step_target_ev_charge_cable_ok
                               or step_charging_state not in eligible_states }}
                      sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ debug_logging }}"
                              sequence:
                                - action: logbook.log
                                  data:
                                    name: Dynamic EV Charging v2.4
                                    entity_id: !input charging_current
                                    message: >-
                                      HOLD RAMP: connection/state safety check failed;
                                      state={{ step_charging_state }}. No further commands sent.
                        - stop: Ramp-up safety gate failed

                    - conditions:
                        - condition: template
                          value_template: "{{ (step_target | float(0)) < (min_amps | float(0)) }}"
                      sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ charger_toggle_entity.startswith('switch.') }}"
                              sequence:
                                - action: switch.turn_off
                                  target:
                                    entity_id: !input charger_toggle
                          default:
                            - action: select.select_option
                              target:
                                entity_id: !input charger_toggle
                              data:
                                option: Stop charging
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ debug_logging }}"
                              sequence:
                                - action: logbook.log
                                  data:
                                    name: Dynamic EV Charging v2.4
                                    entity_id: !input charging_current
                                    message: >-
                                      STOP DURING RAMP: fresh house={{ step_total_consumption | round(0) }} W,
                                      target=0 A. Charging stopped.
                        - stop: Insufficient power during ramp-up

                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ (step_target | float(0)) < (step_current | float(0)) }}
                      sequence:
                        - repeat:
                            while:
                              - condition: template
                                value_template: >-
                                  {{ (states(charging_current_entity) | float(0))
                                     > (step_target | float(0)) }}
                            sequence:
                              - variables:
                                  ramp_down_current: "{{ states(charging_current_entity) | float(0) }}"
                              - action: number.set_value
                                target:
                                  entity_id: !input charging_current
                                data:
                                  value: >-
                                    {{ [ramp_down_current - (decrease_step_amps | float),
                                        step_target | float] | max }}
                              - delay:
                                  seconds: "{{ decrease_delay_seconds | int }}"
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ debug_logging }}"
                              sequence:
                                - action: logbook.log
                                  data:
                                    name: Dynamic EV Charging v2.4
                                    entity_id: !input charging_current
                                    message: >-
                                      RAMP REVERSED: fresh house={{ step_total_consumption | round(0) }} W,
                                      fresh target={{ step_target | round(0) }} A.
                        - stop: Fresh power reading requires ramp-down

                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ (step_target | float(0)) <=
                               ((step_current | float(0)) + (ramp_up_deadband_amps | float(0))) }}
                      sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ debug_logging }}"
                              sequence:
                                - action: logbook.log
                                  data:
                                    name: Dynamic EV Charging v2.4
                                    entity_id: !input charging_current
                                    message: >-
                                      HOLD RAMP: fresh house={{ step_total_consumption | round(0) }} W,
                                      current={{ step_current | round(0) }} A,
                                      target={{ step_target | round(0) }} A,
                                      W/A={{ step_watts_per_amp | round(1) }}
                                      ({{ step_watts_per_amp_source }}).
                        - stop: Fresh target no longer requires ramp-up

                  default:
                    - action: number.set_value
                      target:
                        entity_id: !input charging_current
                      data:
                        value: >-
                          {{ [step_current + (increase_step_amps | float),
                              step_target | float,
                              max_amps | float] | min }}
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ debug_logging }}"
                          sequence:
                            - action: logbook.log
                              data:
                                name: Dynamic EV Charging v2.4
                                entity_id: !input charging_current
                                message: >-
                                  RAMP UP STEP: house={{ step_total_consumption | round(0) }} W,
                                  free={{ step_free_power | round(0) }} W,
                                  current={{ step_current | round(0) }} A,
                                  target={{ step_target | round(0) }} A,
                                  W/A={{ step_watts_per_amp | round(1) }}
                                  ({{ step_watts_per_amp_source }}).

          - stop: Restart sequence completed

  # Active charging: reduce immediately when the calculated target is lower.
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ (charging_current_value | float(0)) > (new_target_value | float(0)) }}
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ (states(charging_current_entity) | float(0)) > (new_target_value | float(0)) }}
              sequence:
                - variables:
                    current_amps_before_step: "{{ states(charging_current_entity) | float(0) }}"
                - action: number.set_value
                  target:
                    entity_id: !input charging_current
                  data:
                    value: >-
                      {{ [current_amps_before_step - (decrease_step_amps | float),
                          new_target_value | float] | max }}
                - delay:
                    seconds: "{{ decrease_delay_seconds | int }}"

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v2.4
                      entity_id: !input charging_current
                      message: >-
                        RAMP DOWN: house={{ total_consumption | round(0) }} W,
                        charger={{ charger_consumption | round(0) }} W ({{ charger_power_source }}),
                        W/A={{ watts_per_amp | round(1) }} ({{ watts_per_amp_source }}),
                        free={{ actual_free_power | round(0) }} W,
                        target={{ new_target_value | round(0) }} A.
          - stop: Ramp-down completed

  # Ignore small upward changes inside the configured deadband.
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ (new_target_value | float(0)) <=
                 ((charging_current_value | float(0)) + (ramp_up_deadband_amps | float(0))) }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v2.4
                      entity_id: !input charging_current
                      message: >-
                        HOLD: current={{ charging_current_value | round(0) }} A,
                        target={{ new_target_value | round(0) }} A is within the
                        {{ ramp_up_deadband_amps | round(0) }} A ramp-up deadband.
          - stop: Target is within ramp-up deadband

  # Before ramping up, wait and re-read live house power.
  - delay:
      seconds: "{{ ramp_up_stability_seconds | int }}"

  - variables:
      confirmed_total_consumption: "{{ states(sensor_house_power_entity) | float(0) }}"
      confirmed_charging_state: >-
        {% if charger_status_sensor_input not in [none, '', 'none']
              and states(charger_status_sensor_input) | lower not in ['unknown', 'unavailable', 'none', ''] %}
          {{ states(charger_status_sensor_input) | lower }}
        {% else %}
          {{ states(sensor_charging_entity) | lower }}
        {% endif %}
      confirmed_current: "{{ states(charging_current_entity) | float(0) }}"
      confirmed_charger_consumption: >-
        {% if charger_power_sensor_input not in [none, '', 'none']
              and (states(charger_power_sensor_input) | float(0)) > 0 %}
          {{ states(charger_power_sensor_input) | float(0) }}
        {% elif confirmed_charging_state in ['charging', 'charging_reduced', 'starting'] %}
          {{ (confirmed_current | float(0)) * (watts_per_amp | float(230)) }}
        {% else %}
          0
        {% endif %}
      confirmed_free_power: >-
        {{ [0, (active_grid_limit | float(0)) - (confirmed_total_consumption | float(0))
              + (confirmed_charger_consumption | float(0))] | max }}
      confirmed_target: >-
        {% set raw_amps = (confirmed_free_power | float(0)) / (watts_per_amp | float(230)) %}
        {% if raw_amps > (max_amps | float) %}
          {{ max_amps | float }}
        {% elif raw_amps < (min_amps | float) %}
          0
        {% else %}
          {{ raw_amps | int }}
        {% endif %}

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ (confirmed_target | float(0)) >
                 ((confirmed_current | float(0)) + (ramp_up_deadband_amps | float(0))) }}
        sequence:
          # Keep one automation run in control of the ramp. Before every increase,
          # wait the configured step delay and recalculate from fresh sensor values.
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ (states(charging_current_entity) | float(0)) < (max_amps | float(0)) }}
              sequence:
                - delay:
                    seconds: "{{ increase_delay_seconds | int }}"

                - variables:
                    step_current: "{{ states(charging_current_entity) | float(0) }}"
                    step_total_consumption: "{{ states(sensor_house_power_entity) | float(0) }}"
                    step_measured_charger_power: >-
                      {% if charger_power_sensor_input not in [none, '', 'none'] %}
                        {{ states(charger_power_sensor_input) | float(0) }}
                      {% else %}
                        0
                      {% endif %}
                    step_measured_charger_current: >-
                      {% if charger_current_sensor_input not in [none, '', 'none'] %}
                        {{ states(charger_current_sensor_input) | float(0) }}
                      {% else %}
                        0
                      {% endif %}
                    step_watts_per_amp: >-
                      {% if (step_measured_charger_power | float(0)) > 0
                            and (step_measured_charger_current | float(0)) > 0 %}
                        {{ (step_measured_charger_power | float(0))
                           / (step_measured_charger_current | float(0)) }}
                      {% else %}
                        {{ theoretical_watts_per_amp | float(230) }}
                      {% endif %}
                    step_watts_per_amp_source: >-
                      {% if (step_measured_charger_power | float(0)) > 0
                            and (step_measured_charger_current | float(0)) > 0 %}
                        measured
                      {% else %}
                        theoretical
                      {% endif %}
                    step_charging_state: >-
                      {% if charger_status_sensor_input not in [none, '', 'none']
                            and states(charger_status_sensor_input) | lower
                                not in ['unknown', 'unavailable', 'none', ''] %}
                        {{ states(charger_status_sensor_input) | lower }}
                      {% else %}
                        {{ states(sensor_charging_entity) | lower }}
                      {% endif %}
                    step_charger_consumption: >-
                      {% if (step_measured_charger_power | float(0)) > 0 %}
                        {{ step_measured_charger_power | float(0) }}
                      {% elif step_charging_state in ['charging', 'charging_reduced', 'starting'] %}
                        {{ (step_current | float(0)) * (step_watts_per_amp | float(230)) }}
                      {% else %}
                        0
                      {% endif %}
                    step_free_power: >-
                      {{ [0, (active_grid_limit | float(0))
                            - (step_total_consumption | float(0))
                            + (step_charger_consumption | float(0))] | max }}
                    step_target: >-
                      {% set raw_amps = (step_free_power | float(0))
                                        / (step_watts_per_amp | float(230)) %}
                      {% if raw_amps > (max_amps | float) %}
                        {{ max_amps | float }}
                      {% elif raw_amps < (min_amps | float) %}
                        0
                      {% else %}
                        {{ raw_amps | int }}
                      {% endif %}
                    step_charger_vehicle_connected_ok: >-
                      {{ charger_vehicle_connected_sensor_input in [none, '', 'none']
                         or is_state(charger_vehicle_connected_sensor_input, 'on') }}
                    step_target_ev_charge_cable_ok: >-
                      {{ target_ev_charge_cable_sensor_input in [none, '', 'none']
                         or is_state(target_ev_charge_cable_sensor_input, 'on') }}

                - choose:
                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ not step_charger_vehicle_connected_ok
                               or not step_target_ev_charge_cable_ok
                               or step_charging_state not in eligible_states }}
                      sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ debug_logging }}"
                              sequence:
                                - action: logbook.log
                                  data:
                                    name: Dynamic EV Charging v2.4
                                    entity_id: !input charging_current
                                    message: >-
                                      HOLD RAMP: connection/state safety check failed;
                                      state={{ step_charging_state }}. No further commands sent.
                        - stop: Ramp-up safety gate failed

                    - conditions:
                        - condition: template
                          value_template: "{{ (step_target | float(0)) < (min_amps | float(0)) }}"
                      sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ charger_toggle_entity.startswith('switch.') }}"
                              sequence:
                                - action: switch.turn_off
                                  target:
                                    entity_id: !input charger_toggle
                          default:
                            - action: select.select_option
                              target:
                                entity_id: !input charger_toggle
                              data:
                                option: Stop charging
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ debug_logging }}"
                              sequence:
                                - action: logbook.log
                                  data:
                                    name: Dynamic EV Charging v2.4
                                    entity_id: !input charging_current
                                    message: >-
                                      STOP DURING RAMP: fresh house={{ step_total_consumption | round(0) }} W,
                                      target=0 A. Charging stopped.
                        - stop: Insufficient power during ramp-up

                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ (step_target | float(0)) < (step_current | float(0)) }}
                      sequence:
                        - repeat:
                            while:
                              - condition: template
                                value_template: >-
                                  {{ (states(charging_current_entity) | float(0))
                                     > (step_target | float(0)) }}
                            sequence:
                              - variables:
                                  ramp_down_current: "{{ states(charging_current_entity) | float(0) }}"
                              - action: number.set_value
                                target:
                                  entity_id: !input charging_current
                                data:
                                  value: >-
                                    {{ [ramp_down_current - (decrease_step_amps | float),
                                        step_target | float] | max }}
                              - delay:
                                  seconds: "{{ decrease_delay_seconds | int }}"
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ debug_logging }}"
                              sequence:
                                - action: logbook.log
                                  data:
                                    name: Dynamic EV Charging v2.4
                                    entity_id: !input charging_current
                                    message: >-
                                      RAMP REVERSED: fresh house={{ step_total_consumption | round(0) }} W,
                                      fresh target={{ step_target | round(0) }} A.
                        - stop: Fresh power reading requires ramp-down

                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ (step_target | float(0)) <=
                               ((step_current | float(0)) + (ramp_up_deadband_amps | float(0))) }}
                      sequence:
                        - choose:
                            - conditions:
                                - condition: template
                                  value_template: "{{ debug_logging }}"
                              sequence:
                                - action: logbook.log
                                  data:
                                    name: Dynamic EV Charging v2.4
                                    entity_id: !input charging_current
                                    message: >-
                                      HOLD RAMP: fresh house={{ step_total_consumption | round(0) }} W,
                                      current={{ step_current | round(0) }} A,
                                      target={{ step_target | round(0) }} A,
                                      W/A={{ step_watts_per_amp | round(1) }}
                                      ({{ step_watts_per_amp_source }}).
                        - stop: Fresh target no longer requires ramp-up

                  default:
                    - action: number.set_value
                      target:
                        entity_id: !input charging_current
                      data:
                        value: >-
                          {{ [step_current + (increase_step_amps | float),
                              step_target | float,
                              max_amps | float] | min }}
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ debug_logging }}"
                          sequence:
                            - action: logbook.log
                              data:
                                name: Dynamic EV Charging v2.4
                                entity_id: !input charging_current
                                message: >-
                                  RAMP UP STEP: house={{ step_total_consumption | round(0) }} W,
                                  free={{ step_free_power | round(0) }} W,
                                  current={{ step_current | round(0) }} A,
                                  target={{ step_target | round(0) }} A,
                                  W/A={{ step_watts_per_amp | round(1) }}
                                  ({{ step_watts_per_amp_source }}).

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v2.4
                      entity_id: !input charging_current
                      message: >-
                        RAMP UP COMPLETE: reached Maximum Charging Current
                        ({{ max_amps | round(0) }} A).
    default:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ debug_logging }}"
            sequence:
              - action: logbook.log
                data:
                  name: Dynamic EV Charging v2.4
                  entity_id: !input charging_current
                  message: >-
                    HOLD AFTER STABILITY CHECK: fresh target={{ confirmed_target | round(0) }} A,
                    current={{ confirmed_current | round(0) }} A.

mode: single
max_exceeded: silent

