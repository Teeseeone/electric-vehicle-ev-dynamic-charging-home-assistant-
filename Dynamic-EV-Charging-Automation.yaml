blueprint:
  name: Dynamic EV Charging Automation v2.4
  description: >
    **v2.4 - Supply presets, Tesla Fleet states, hysteresis and restart protection**
    - Added single-phase 230 V, three-phase 230 V and three-phase 400 V supply choices
    - Added Tesla Fleet charging states: starting, charging, stopped, complete, disconnected and no_power
    - Added configurable ramp-up deadband
    - Added a ramp-up stability delay that re-checks live household power before increasing current
    - Added a restart lockout after stopped/no_power states (default 5 minutes)
    - Added optional debug entries in the Home Assistant logbook
    - Keeps v2.3 support for switch-based start/stop and independent ramp-up/ramp-down settings

    **v2.3 - Tesla switch support and separate ramp-up/ramp-down behavior**
    - EV Charging Toggle can be either a select or switch entity
    - Switch entities use turn_on to start charging and turn_off to stop charging
    - Added direct support for Tesla Fleet charging switches
    - Added independent step sizes and delays for increasing and decreasing charging current
    - Improved handling when the target falls below the minimum charging current

    **v2.2 - Optional location tracker**
    - The Car/Person Location Tracker is optional
    - Leave it empty to disable location-based checks

    This automation dynamically adjusts EV charging current based on household power consumption.
    It supports direct Tesla Fleet charging control as well as the original select-based charger control.

  domain: automation

  input:
    interval:
      name: Adjustment Interval (minutes)
      description: How often the automation recalculates available charging power.
      default: /1
      selector:
        select:
          options:
            - label: "1 minute"
              value: /1
            - label: "3 minutes"
              value: /3
            - label: "5 minutes"
              value: /5

    device_tracker:
      name: Car/Person Location Tracker (Optional)
      description: Optional tracker. Leave empty to disable the location check.
      default: ""
      selector:
        entity:
          domain: device_tracker

    sensor_charging:
      name: EV Charging Sensor
      description: >
        Charging-state sensor. Tesla Fleet reports states such as starting, charging,
        stopped, complete, disconnected and no_power.
      default: sensor.ev_charger_estado
      selector:
        entity:
          domain: sensor

    charger_toggle:
      name: EV Charging Toggle (Start/Stop)
      description: >
        Start/stop control. Supports select entities using "Start charging" / "Stop charging"
        and switch entities where turn_on starts charging and turn_off stops charging.
      default: select.ev_charger_toggle_charging
      selector:
        entity:
          domain:
            - select
            - switch

    sensor_house_power:
      name: Total Power Consumption Sensor
      description: Whole-house power consumption in watts.
      default: sensor.shellyemg3_8cbfea96acd8_em1_power
      selector:
        entity:
          domain: sensor
          device_class: power

    charger_power_sensor:
      name: Actual Charger Power Sensor (Optional)
      description: >
        Optional measured EV charger power sensor in watts. When selected, the blueprint
        uses the measured charger power instead of estimating charger consumption from
        charging current and supply type. Recommended when a local charger integration
        exposes real-time power, such as a Tesla Wall Connector. Leave empty to use the
        electrical supply calculation as a fallback.
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: power

    charger_status_sensor:
      name: Local Charger Status Sensor (Optional)
      description: >
        Optional local charger status sensor. When selected, this is preferred over the
        slower EV/Tesla Fleet charging-state sensor for dynamic-control decisions.
        For a Tesla Wall Connector use the local Status entity, for example
        sensor.tesla_wall_connector_status.
      default: ""
      selector:
        entity:
          domain: sensor

    max_grid_power:
      name: Maximum Grid Draw (W)
      description: Maximum total household power draw the automation should allow.
      default: 9000
      selector:
        number:
          min: 0
          max: 30000
          step: 100

    charging_current:
      name: Charging Current Control
      description: Number entity used to set EV charging current.
      default: number.ev_charger_set_charge_current
      selector:
        entity:
          domain: number

    supply_type:
      name: Charging Supply
      description: >
        Select the electrical supply used for EV charging. Three-phase calculations use
        sqrt(3) × line-to-line voltage × current.
      default: single_phase_230
      selector:
        select:
          options:
            - label: "Single-phase 230 V"
              value: single_phase_230
            - label: "Three-phase 230 V"
              value: three_phase_230
            - label: "Three-phase 400 V"
              value: three_phase_400

    max_amps:
      name: Maximum amps
      description: Maximum charging current the automation may request.
      default: 20
      selector:
        number:
          min: 6
          max: 32
          step: 1

    min_amps:
      name: Minimum amps
      description: >
        Minimum requested charging current. If calculated available power is below this
        value, the automation stops charging instead of requesting a lower current.
        The EV/charger may enforce a higher physical minimum than this setting.
      default: 1
      selector:
        number:
          min: 1
          max: 32
          step: 1

    increase_step_amps:
      name: Ramp-up step size (A)
      description: Amps added per ramp-up step.
      default: 1
      selector:
        number:
          min: 1
          max: 10
          step: 1

    increase_delay_seconds:
      name: Ramp-up delay (seconds)
      description: Delay between ramp-up steps.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1

    decrease_step_amps:
      name: Ramp-down step size (A)
      description: Amps removed per ramp-down step.
      default: 2
      selector:
        number:
          min: 1
          max: 10
          step: 1

    decrease_delay_seconds:
      name: Ramp-down delay (seconds)
      description: Delay between ramp-down steps.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1

    ramp_up_deadband_amps:
      name: Ramp-up deadband (A)
      description: >
        Ignore small increases that are within this many amps of the current setting.
        Ramp-down is never blocked by this deadband.
      default: 1
      selector:
        number:
          min: 0
          max: 5
          step: 1

    ramp_up_stability_seconds:
      name: Ramp-up stability time (seconds)
      description: >
        Before increasing current, wait this long and then recalculate using fresh household
        power. The increase only continues if spare power is still available.
      default: 30
      selector:
        number:
          min: 0
          max: 300
          step: 5

    restart_delay_seconds:
      name: Restart delay after stop (seconds)
      description: >
        Minimum time the charging-state sensor must remain stopped/no_power before the
        automation may restart charging. Default is 300 seconds (5 minutes).
      default: 300
      selector:
        number:
          min: 0
          max: 1800
          step: 30

    debug_logging:
      name: Debug logging
      description: >
        Write calculation and decision details to the Home Assistant Logbook.
      default: false
      selector:
        boolean:


triggers:
  - trigger: time_pattern
    minutes: !input interval

variables:
  device_tracker_input: !input device_tracker

condition:
  - condition: template
    value_template: >-
      {{ device_tracker_input in [none, '', 'none']
         or is_state(device_tracker_input, 'home') }}

action:
  - variables:
      supply_type: !input supply_type
      max_amps: !input max_amps
      min_amps: !input min_amps
      increase_step_amps: !input increase_step_amps
      increase_delay_seconds: !input increase_delay_seconds
      decrease_step_amps: !input decrease_step_amps
      decrease_delay_seconds: !input decrease_delay_seconds
      ramp_up_deadband_amps: !input ramp_up_deadband_amps
      ramp_up_stability_seconds: !input ramp_up_stability_seconds
      restart_delay_seconds: !input restart_delay_seconds
      debug_logging: !input debug_logging

      sensor_house_power_entity: !input sensor_house_power
      charger_power_sensor_input: !input charger_power_sensor
      charger_status_sensor_input: !input charger_status_sensor
      charging_current_entity: !input charging_current
      sensor_charging_entity: !input sensor_charging
      charger_toggle_entity: !input charger_toggle

      active_grid_limit: !input max_grid_power

      watts_per_amp: >-
        {% if supply_type == 'single_phase_230' %}
          {{ 230 }}
        {% elif supply_type == 'three_phase_230' %}
          {{ 230 * 1.7320508075688772 }}
        {% else %}
          {{ 400 * 1.7320508075688772 }}
        {% endif %}

      fleet_charging_state: "{{ states(sensor_charging_entity) | lower }}"
      local_charger_state: >-
        {% if charger_status_sensor_input not in [none, '', 'none'] %}
          {{ states(charger_status_sensor_input) | lower }}
        {% else %}
          unavailable
        {% endif %}
      charging_state: >-
        {% if charger_status_sensor_input not in [none, '', 'none']
              and local_charger_state not in ['unknown', 'unavailable', 'none', ''] %}
          {{ local_charger_state }}
        {% else %}
          {{ fleet_charging_state }}
        {% endif %}
      status_entity_for_timing: >-
        {% if charger_status_sensor_input not in [none, '', 'none']
              and local_charger_state not in ['unknown', 'unavailable', 'none', ''] %}
          {{ charger_status_sensor_input }}
        {% else %}
          {{ sensor_charging_entity }}
        {% endif %}
      charging_current_value: "{{ states(charging_current_entity) | float(0) }}"
      total_consumption: "{{ states(sensor_house_power_entity) | float(0) }}"

      measured_charger_power: >-
        {% if charger_power_sensor_input not in [none, '', 'none'] %}
          {{ states(charger_power_sensor_input) | float(0) }}
        {% else %}
          0
        {% endif %}

      charger_power_source: >-
        {% if charger_power_sensor_input not in [none, '', 'none']
              and (measured_charger_power | float(0)) > 0 %}
          measured
        {% else %}
          estimated
        {% endif %}

      charger_consumption: >-
        {% if charger_power_source == 'measured' %}
          {{ measured_charger_power | float(0) }}
        {% elif charging_state in ['charging', 'charging_reduced', 'starting'] %}
          {{ (charging_current_value | float(0)) * (watts_per_amp | float(230)) }}
        {% else %}
          0
        {% endif %}

      actual_free_power: >-
        {{ [0, (active_grid_limit | float(0)) - (total_consumption | float(0)) + (charger_consumption | float(0))] | max }}

      new_target_value: >-
        {% set raw_amps = (actual_free_power | float(0)) / (watts_per_amp | float(230)) %}
        {% if raw_amps > (max_amps | float) %}
          {{ max_amps | float }}
        {% elif raw_amps < (min_amps | float) %}
          0
        {% else %}
          {{ raw_amps | int }}
        {% endif %}

      stopped_seconds: >-
        {% if charger_toggle_entity.startswith('switch.') and is_state(charger_toggle_entity, 'off') %}
          {{ as_timestamp(now()) - as_timestamp(states[charger_toggle_entity].last_changed) }}
        {% elif charging_state in ['stopped', 'no_power', 'ready', 'connected', 'waiting_car', 'negotiating', 'plugged_in', 'waiting', 'waiting_for_authorization'] %}
          {{ as_timestamp(now()) - as_timestamp(states[status_entity_for_timing].last_changed) }}
        {% else %}
          0
        {% endif %}

      eligible_states:
        - charging
        - charging_reduced
        - starting
        - stopped
        - no_power
        - ready
        - connected
        - waiting_car
        - negotiating
        - plugged_in
        - waiting
        - waiting_for_authorization

  # Do not interfere when charging is complete, disconnected, unavailable, or in an unsupported state.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ charging_state not in eligible_states }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v2.4
                      entity_id: !input sensor_charging
                      message: >-
                        HOLD: charging state '{{ charging_state }}' is not eligible for dynamic control.
          - stop: Charging state is not eligible for dynamic control

  # Stop charging when available power is below the configured minimum.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ (new_target_value | float(0)) < (min_amps | float) }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ charger_toggle_entity.startswith('switch.') }}"
                sequence:
                  - action: switch.turn_off
                    target:
                      entity_id: !input charger_toggle
            default:
              - action: select.select_option
                target:
                  entity_id: !input charger_toggle
                data:
                  option: Stop charging

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v2.4
                      entity_id: !input charging_current
                      message: >-
                        STOP: house={{ total_consumption | round(0) }} W,
                        charger={{ charger_consumption | round(0) }} W ({{ charger_power_source }}),
                        limit={{ active_grid_limit | round(0) }} W,
                        free={{ actual_free_power | round(0) }} W,
                        target=0 A, state={{ charging_state }}.
          - stop: Not enough power to charge above the minimum current

  # Startable idle states enter the restart/start sequence.
  # The 5-minute lockout applies specifically to stopped/no_power.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ charging_state in ['stopped', 'no_power', 'ready', 'connected', 'waiting_car', 'negotiating', 'plugged_in', 'waiting', 'waiting_for_authorization'] }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ (charger_toggle_entity.startswith('switch.') and is_state(charger_toggle_entity, 'off')
                          or charging_state in ['stopped', 'no_power'])
                         and (stopped_seconds | float(0)) < (restart_delay_seconds | float(0)) }}
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ debug_logging }}"
                        sequence:
                          - action: logbook.log
                            data:
                              name: Dynamic EV Charging v2.4
                              entity_id: !input sensor_charging
                              message: >-
                                WAIT TO RESTART: stopped for {{ stopped_seconds | int }} s;
                                restart lockout={{ restart_delay_seconds | int }} s.
                  - stop: Restart lockout is still active

          # Require stable spare power and recalculate from fresh sensor values before restarting.
          - delay:
              seconds: "{{ ramp_up_stability_seconds | int }}"

          - variables:
              confirmed_total_consumption: "{{ states(sensor_house_power_entity) | float(0) }}"
              confirmed_free_power: >-
                {{ [0, (active_grid_limit | float(0)) - (states(sensor_house_power_entity) | float(0))] | max }}
              confirmed_target: >-
                {% set raw_amps = (confirmed_free_power | float(0)) / (watts_per_amp | float(230)) %}
                {% if raw_amps > (max_amps | float) %}
                  {{ max_amps | float }}
                {% elif raw_amps < (min_amps | float) %}
                  0
                {% else %}
                  {{ raw_amps | int }}
                {% endif %}

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (confirmed_target | float(0)) >= (min_amps | float) }}"
                sequence:
                  # Set a safe starting current before turning charging back on.
                  - action: number.set_value
                    target:
                      entity_id: !input charging_current
                    data:
                      value: "{{ min_amps | float }}"

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ charger_toggle_entity.startswith('switch.') }}"
                        sequence:
                          - action: switch.turn_on
                            target:
                              entity_id: !input charger_toggle
                    default:
                      - action: select.select_option
                        target:
                          entity_id: !input charger_toggle
                        data:
                          option: Start charging

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ debug_logging }}"
                        sequence:
                          - action: logbook.log
                            data:
                              name: Dynamic EV Charging v2.4
                              entity_id: !input charging_current
                              message: >-
                                RESTART: stable free power={{ confirmed_free_power | round(0) }} W,
                                confirmed target={{ confirmed_target | round(0) }} A.
            default:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ debug_logging }}"
                    sequence:
                      - action: logbook.log
                        data:
                          name: Dynamic EV Charging v2.4
                          entity_id: !input sensor_charging
                          message: >-
                            HOLD STOPPED: power was not still sufficient after
                            {{ ramp_up_stability_seconds | int }} s stability check.
              - stop: Spare power was not stable enough to restart

          # Ramp from the safe minimum toward the confirmed target.
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ (states(charging_current_entity) | float(0)) < (confirmed_target | float(0)) }}
              sequence:
                - variables:
                    current_amps_before_step: "{{ states(charging_current_entity) | float(0) }}"
                - action: number.set_value
                  target:
                    entity_id: !input charging_current
                  data:
                    value: >-
                      {{ [current_amps_before_step + (increase_step_amps | float),
                          confirmed_target | float] | min }}
                - delay:
                    seconds: "{{ increase_delay_seconds | int }}"

          - stop: Restart sequence completed

  # Active charging: reduce immediately when the calculated target is lower.
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ (charging_current_value | float(0)) > (new_target_value | float(0)) }}
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ (states(charging_current_entity) | float(0)) > (new_target_value | float(0)) }}
              sequence:
                - variables:
                    current_amps_before_step: "{{ states(charging_current_entity) | float(0) }}"
                - action: number.set_value
                  target:
                    entity_id: !input charging_current
                  data:
                    value: >-
                      {{ [current_amps_before_step - (decrease_step_amps | float),
                          new_target_value | float] | max }}
                - delay:
                    seconds: "{{ decrease_delay_seconds | int }}"

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v2.4
                      entity_id: !input charging_current
                      message: >-
                        RAMP DOWN: house={{ total_consumption | round(0) }} W,
                        charger={{ charger_consumption | round(0) }} W ({{ charger_power_source }}),
                        free={{ actual_free_power | round(0) }} W,
                        target={{ new_target_value | round(0) }} A.
          - stop: Ramp-down completed

  # Ignore small upward changes inside the configured deadband.
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ (new_target_value | float(0)) <=
                 ((charging_current_value | float(0)) + (ramp_up_deadband_amps | float(0))) }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v2.4
                      entity_id: !input charging_current
                      message: >-
                        HOLD: current={{ charging_current_value | round(0) }} A,
                        target={{ new_target_value | round(0) }} A is within the
                        {{ ramp_up_deadband_amps | round(0) }} A ramp-up deadband.
          - stop: Target is within ramp-up deadband

  # Before ramping up, wait and re-read live house power.
  - delay:
      seconds: "{{ ramp_up_stability_seconds | int }}"

  - variables:
      confirmed_total_consumption: "{{ states(sensor_house_power_entity) | float(0) }}"
      confirmed_charging_state: >-
        {% if charger_status_sensor_input not in [none, '', 'none']
              and states(charger_status_sensor_input) | lower not in ['unknown', 'unavailable', 'none', ''] %}
          {{ states(charger_status_sensor_input) | lower }}
        {% else %}
          {{ states(sensor_charging_entity) | lower }}
        {% endif %}
      confirmed_current: "{{ states(charging_current_entity) | float(0) }}"
      confirmed_charger_consumption: >-
        {% if charger_power_sensor_input not in [none, '', 'none']
              and (states(charger_power_sensor_input) | float(0)) > 0 %}
          {{ states(charger_power_sensor_input) | float(0) }}
        {% elif confirmed_charging_state in ['charging', 'charging_reduced', 'starting'] %}
          {{ (confirmed_current | float(0)) * (watts_per_amp | float(230)) }}
        {% else %}
          0
        {% endif %}
      confirmed_free_power: >-
        {{ [0, (active_grid_limit | float(0)) - (confirmed_total_consumption | float(0))
              + (confirmed_charger_consumption | float(0))] | max }}
      confirmed_target: >-
        {% set raw_amps = (confirmed_free_power | float(0)) / (watts_per_amp | float(230)) %}
        {% if raw_amps > (max_amps | float) %}
          {{ max_amps | float }}
        {% elif raw_amps < (min_amps | float) %}
          0
        {% else %}
          {{ raw_amps | int }}
        {% endif %}

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ (confirmed_target | float(0)) >
                 ((confirmed_current | float(0)) + (ramp_up_deadband_amps | float(0))) }}
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ (states(charging_current_entity) | float(0)) < (confirmed_target | float(0)) }}
              sequence:
                - variables:
                    current_amps_before_step: "{{ states(charging_current_entity) | float(0) }}"
                - action: number.set_value
                  target:
                    entity_id: !input charging_current
                  data:
                    value: >-
                      {{ [current_amps_before_step + (increase_step_amps | float),
                          confirmed_target | float] | min }}
                - delay:
                    seconds: "{{ increase_delay_seconds | int }}"

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ debug_logging }}"
                sequence:
                  - action: logbook.log
                    data:
                      name: Dynamic EV Charging v2.4
                      entity_id: !input charging_current
                      message: >-
                        RAMP UP: fresh house={{ confirmed_total_consumption | round(0) }} W,
                        free={{ confirmed_free_power | round(0) }} W,
                        confirmed target={{ confirmed_target | round(0) }} A.
    default:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ debug_logging }}"
            sequence:
              - action: logbook.log
                data:
                  name: Dynamic EV Charging v2.4
                  entity_id: !input charging_current
                  message: >-
                    HOLD AFTER STABILITY CHECK: fresh target={{ confirmed_target | round(0) }} A,
                    current={{ confirmed_current | round(0) }} A.

mode: restart
